name: R33 distributed execution lease validation

on:
  push:
    branches:
      - gpt/revolution-r33-distributed-execution-lease
  workflow_dispatch:

jobs:
  r33-deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked backend test dependencies
        working-directory: backend
        run: uv sync --extra dev --no-install-project
      - name: Compile distributed execution surfaces
        working-directory: backend
        run: uv run python -m compileall -q app
      - name: Run inherited R32 plus R33 lease core
        working-directory: backend
        run: |
          uv run python -m pytest -q \
            tests/test_r33_execution_lease.py \
            tests/test_r32_recovery_epoch.py \
            tests/test_r32_machine_verdict.py \
            tests/test_r31_epoch_integrity.py \
            tests/test_r30_collective_authority_receipt.py \
            tests/test_r29_disagreement_mediation.py \
            tests/test_r28_durable_approval_continuation.py \
            tests/test_agent_runtime_state_epoch.py \
            tests/test_agent_runtime_gate.py \
            tests/test_agent_mission_runtime.py
