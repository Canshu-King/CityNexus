openapi: 3.1.0
#
# CITYNEXUS-ANYWHERE 契约 · 车道 F **附件**（ORD-0094 · 2026-09-21 13:5x）
# =============================================================================
# 这份文件原本是我（车道 F）写的目标契约草案。仲裁已在
# `arbiter/anywhere-contract` 上交付正式契约：
#   contracts/anywhere_v1.openapi.yaml  （commit `0c0aa82` "contract: define Anywhere
#   capability and hydration v1"，分支 tip `e49dfb1`，536 行 / 22 schema）
# 那份覆盖得更全（写事务规则、AgentOutcome、Provenance 的 source_kind 与 fact_quality
# 不许升级，都在里面）。**所以我不再重复登记端点与 schema** —— 同一件事留两份定义，
# 将来一定有一份在说谎。本文件降级为附件，只保留正式契约里没有、而 ORD-0094 要求的
# 四块内容：实测差集、延迟预算、§17C/D/E 的测试义务、以及逐条对照表。
#
# 正式契约落地到权威树之后，`backend/tests/test_qoder_anywhere_contract_parity.py`
# 会从"对照下面这张表里的字面量"切换成"直接解析 contracts/anywhere_v1.openapi.yaml"，
# 那份文件才是真值源；切换点写在同一个文件里，不用另找人记这件事。
info:
  title: CityNexus ANYWHERE contract annex (lane F) — authority lives in anywhere_v1.openapi.yaml
  version: 0.94-annex.4
  description: >-
    Measurements, latency budget, test obligations and the point-by-point reconciliation
    against the arbiter's Anywhere v1 contract. Defines no operations and no reusable
    schemas on purpose: the operations are the arbiter's, and a second copy here would be
    the next "the contract says one thing, the code another" incident.
  x-authority:
    branch: arbiter/anywhere-contract
    contract-file: contracts/anywhere_v1.openapi.yaml
    introduced-by: 0c0aa82
    branch-tip-observed: e49dfb1
    observed-at: "2026-09-21 13:5x +0800, read-only: git ls-remote --heads + git fetch + git ls-tree/git show (working tree untouched)"
  x-status: annex-of-arbiter-contract
  x-authored-by: "lane F (session 8ccd71d8) · ORD-0094 · authoritative HEAD 4c8c911"

  # -----------------------------------------------------------------------------
  # ① 实测差集：契约里有、实现里没有 —— 四条全缺，且是活进程量出来的
  # -----------------------------------------------------------------------------
  x-differential-evidence:
    measured-at: "2026-09-21 13:32:17 +0800 (machine clock)"
    server: "lane F's own uvicorn on 127.0.0.1:8652, own sqlite file D:/moodle/_qoder_f_run/_runF1.db, CITYNEXUS_DEMO_MODE=true, AI off, provider credentials cleared, code = 4c8c911"
    interpreter: "D:/moodle/CityNexus/.venv/Scripts/python.exe (3.12.14)"
    method: "curl -w '%{http_code}' plus the body, against the running process"
    targets:
      - "GET  /api/v1/destinations/capability?query=贡山独龙族怒族自治县 -> 404 {\"detail\":\"Not Found\"}"
      - "POST /api/v1/catalog-hydrations                                 -> 404 {\"detail\":\"Not Found\"}"
      - "GET  /api/v1/catalog-hydrations/{uuid}                          -> 404 {\"detail\":\"Not Found\"}"
      - "POST /api/v1/catalog-hydrations/{uuid}/abandon                  -> 404 {\"detail\":\"Not Found\"}"
    controls-same-process-same-minute:
      - "GET /api/v1/health      -> 200"
      - "GET /api/v1/demo/scene  -> 200"
    reading: >-
      Four for four absent while the very same process answers 200 on two other routes, so
      these are router-level absences, not a server that was down. Re-measurable by anyone:
      run backend/tests/test_qoder_anywhere_contract_parity.py.

  # -----------------------------------------------------------------------------
  # ② 对照表：哪条按仲裁的、哪条按车道 F 的
  # -----------------------------------------------------------------------------
  x-reconciliation:
    follows-arbiter:
      - "端点集合与 operationId：POST /catalog-hydrations 定为 createOrReuseCatalogHydration（我草案里叫 createCatalogHydration）—— 名字本身就写了'或复用'，按它。"
      - "能力裁决字段名 `capability`（我草案叫 state）；枚举 READY|HYDRATABLE|UNAVAILABLE 三值，按它。"
      - "我草案里私自加的第四个态 `UNKNOWN` 撤掉：'量不出来'走 ReasonCode（DESTINATION_RESOLVER_UNAVAILABLE / NO_TRACEABLE_CATALOG_SOURCE），不扩状态枚举。"
      - "覆盖度：DestinationCoverage 六键 attractions/food/nightlife/lodging/mobility/booking，取值 READY|PARTIAL|MISSING（我多写的 UNKNOWN 撤掉），按它。"
      - "水合操作是**双轴**：status（QUEUED|RUNNING|COMPLETED|FAILED|UNAVAILABLE|ABANDON_REQUESTED|ABANDONED）+ phase（QUEUED…FINALIZING）。我草案只有一条 phase，会分不清'放弃了但还在跑'与'跑完了'，按它。"
      - "必填字段表：operation_id/fingerprint/reused/status/phase/elapsed_ms/retry_after_ms/status_url/abandon_url 全 required；我草案把 reused 写成可选，按它。"
      - "Provenance 是对象不是单词：source_kind ∈ GOLDEN_FIXTURE|REMOTE_PROVIDER|SIMULATED|REPLAY|OFFLINE_SNAPSHOT，外加 fact_quality 且'归一化不得把 SIMULATED/PARTIAL/未知升成更强类'。我草案那套平铺 enum 作废，按它。"
      - "ReasonCode 取它的 9 值；RecommendedAction 取它的 7 值（我草案里的 CHOOSE_CANDIDATE 撤，歧义由 candidates/AMBIGUOUS 路径表达）；ProviderStatus 取它的 OK|RATE_LIMITED|UNREACHABLE|PARTIAL。"
      - "响应码：POST /catalog-hydrations 是 200/202/422/503（我写了 409，按它改成 422/503 分工）。"
      - "R2：结构与运行时是两条真值，我原先糊成一条。capability = READY|HYDRATABLE|UNAVAILABLE（三值，没有 UNKNOWN）；provider_status = OK|RATE_LIMITED|UNREACHABLE|PARTIAL（四值）。没有观测=没查过，不得写成 OK（R2 原话 do not fabricate OK）；PARTIAL=响应可解析但不完整。组合有含义：UNAVAILABLE+无故障=没有可追溯来源；HYDRATABLE+UNREACHABLE=能支持但现在到不了；HYDRATABLE+RATE_LIMITED=可重试，不得显示成永久不支持。"
      - "capability 只接 `query` 一个参数（我加的 journey_id 撤）：绑定旅程发生在 POST /catalog-hydrations 的请求体里，它已带 journey_id/canonical_destination_id/requested_categories。"
    lane-f-additions:
      - "① 实测差集（正式契约不记录现实，只规定应然；这份把'四条全缺 + 同一进程对照 200'钉成可复跑读数）。"
      - "② 延迟预算 p95<=1s / hard<=2s（§6 的数在两边都没写成字段约束，这里定成可断言形式）。"
      - "③ §17C/D/E 三条测试义务（下面 x-testing-obligations），正式契约只写了'provider 网络不得持写事务'这一条规则，没规定怎么证明。"
      - "④ 双向 parity：实现了却还把契约挂着未登记 ⇒ 红。防的正是这份附件被长期留在'草案'状态。"
      - "⑤ §9 矩阵上界（x-matrix-bound：N ≤ 20）与三枚矩阵门（单位 / cells 预检 / 直线距离不得冒充 travel_minutes）。ORD-0106 续，**纯增补**：0.94-annex.1 → .2 未改任何已定枚举、未删任何既有键，改动清单就是上面 ⑤ 与三条 obligations（留痕规则：改契约必须当场说出来）。"
      - "⑥ 服务端真值字段 x-server-truth-fields（provider_budget / discovery_area，readiness_policy_version 只是登记）与三条发现层 obligations（TTL 必须有人读 / 范围来自 extent / 没问的分类不得落默认集合），每条带 measured-on 与实测 finding。ORD-0106 继续，**纯增补**：.2 → .3 未改任何已定枚举、未删任何既有键、paths 仍为 {}。"
      - "⑦ ORD-0118 的运行时绊线结论（runtime-egress-tripwire 条：静态扫描必要但不充分，真外呼在 test_agent_mission_runtime 那条绿测试里，401 已实测）＋ capability 拼写归零那条门 ＋ x-red-doors 红门台账（每条红标 kind/owner/cause/rerun）。**纯增补**：.3 → .4 未改任何已定枚举、未删任何既有键、paths 仍为 {}。"
    questions-closed-by-v0_2:
      - "stale 要不要把 READY 降下来 —— v0.2 已定：HYDRATABLE 的定义本身含 missing/stale/incomplete ⇒ 本地数据过期不是 READY+背景刷新，而是 HYDRATABLE。我上一轮写的『不自动降级但要说出来』作废；G1/G4 改成 READY 必须由带版本的服务端策略 readiness_policy_version 判定，过期即不得为 READY。"
      - "UNAVAILABLE 与 resolver 故障的分界 —— v0.2 R1 已定：三态只描述结构性能力；Photon 暂时不可达要回 DESTINATION_RESOLVER_UNAVAILABLE 且保持可重试，不得因解析器挂了就永久降成 UNAVAILABLE；已有 canonical 身份可直接答、不再探测。v1 解析器只有 Photon，Nominatim 不是 v1 依赖，且不得发 lang=zh（换写法=换身份）。G1 加了这条组合判定。"
      - "R3（current-plan 用 per-plan is_current 派生、唯一持久真值仍是 journey.active_plan_version_id，不得持久化也不得独立改动）不在我这四张门范围内，记在这里是为了让车道 A/C 知道它已裁定，别再各写一份。"
  # -----------------------------------------------------------------------------
  # ③ §6 的延迟预算（可断言形式）
  # -----------------------------------------------------------------------------
x-latency-budget:
  post-acceptance-p95-ms: 1000
  post-acceptance-hard-ms: 2000
  measured-by: "CatalogHydrationOperation.elapsed_ms 之外，门侧另算墙钟：受理段不含任何 provider 调用"
  note: "拿不出这个数字就等于没满足它（规则：先测量再宣称）。"

# -----------------------------------------------------------------------------
# ④ §17C / §17D / §17E 测试义务（Commander 13:4x 补发的三条，最容易漏）
# -----------------------------------------------------------------------------
x-testing-obligations:
  suite-must-not-depend-on-live-providers:
    rule: >-
      常规后端套件（900+ 条）一律走确定性 fixture/mock，不许真打 photon.komoot.io /
      overpass-api.de / overpass.private.coffee / overpass.kumi.systems /
      nominatim.openstreetmap.org / restapi.amap.com / api.open-meteo.com /
      api.deepseek.com（域名清单抄自 app/integrations/**，不是猜的）。
    mechanism: >-
      默认收集范围内不得出现对这些主机的真实出网；live 验证单独放
      backend/tests/live/，必须显式 CITYNEXUS_LIVE_PROVIDER_SMOKE=1 才跑，且跑时必须
      落盘：环境、出口（哪张网卡/哪个链路）、每次请求耗时与状态、原始响应路径。
      opt-in 的实现方式不是 skip —— 未开开关时它**响亮地失败**（RC != 0 + 指名原因），
      这样"忘了跑 live"不会被读成"live 已过"。
    gate: backend/tests/test_qoder_anywhere_provider_independence.py
  durable-idempotency-and-concurrency:
    rule: >-
      2~5 个同指纹并发必须收敛到同一个 operation_id；持久层同一指纹的非终态操作**至多一条**，
      由唯一索引强制（不是进程内锁 —— 两个 uvicorn worker 不共享一把锁）；
      provider 调用不得因并发而翻倍；`reused=true` 必须如实。
    # v0.2（docs/anywhere_capability.md 的 durable fingerprint）要的是**至少**这四段：
    fingerprint: canonical_destination_id + catalog_schema_version + readiness_policy_version + provider_policy_version
    # ORD-0167（仲裁 `e4b7faa3`）把这句话补全成两半：**认得出目的地**时就是上面四段；
    # **认不出**时身份列为 null，指纹换成 `pending-request-v1 + scope + 归一化查询 + 同三个版本`。
    # 两者都不含用户原文、也不含 `destination_pending_key`（那是 correlation 材料，不是身份）；
    # "raw text is not identity"，收敛由请求指纹完成，不靠给一句话发身份证。
    fingerprint-unresolved: "pending-request-v1 + scope + resolver_query_normalized + catalog_schema_version + readiness_policy_version + provider_policy_version"
    gate: backend/tests/test_qoder_anywhere_gates.py::test_g3_five_concurrent_hydrations_of_one_county_converge_on_one_operation
  geometry-completeness:
    rule: >-
      规范化后的地点集合里 node / way / relation 三类都必须带可用坐标，进多少行出多少行；
      少一行必须说出来，不许静默丢弃。触发教训（车道 B 实测）：Overpass 的 `out center` verbosity
      **不吃 node 坐标**，第一版 24 行只回来 11 行、缺的 13 行全是 node，且**没有任何报错**。
    gate: backend/tests/test_qoder_anywhere_provider_truth.py::test_g10_every_normalised_place_carries_a_usable_coordinate_including_nodes

  failure-codes-must-not-collapse:
    rule: >-
      429 / 5xx / 超时 / 连接重置 / 非法结构 / 零结果 六种形状必须各自得到不同的稳定 reason_code，
      用户面不得出现异常类名，也不得靠 `<?xml` 首部区分。B 实测它们今天挤在 HTTPStatusError /
      ReadTimeout / RemoteProtocolError / RuntimeError 四种 Python 类名里。
    measured-on: aee6c7a
    finding: >-
      车道 C 的 ORD-0099 映射（`live_failure_reason`，d481464）已经把 429 与超时、连接重置分开了，
      但 **5xx 与『结构非法』同落 PROVIDER_BAD_RESPONSE**（6 形状 ⇒ 5 码），且『零结果』只有当异常文本
      含哨兵 `NO_JOURNEY_DERIVED_CITY_ANCHOR` 时才拿到 PROVIDER_NO_RESULTS —— 真的 200 空要素不是异常，
      走不到这条码。给 C 的最小改法：加 PROVIDER_SERVER_ERROR 接 5xx；零结果按响应形状判定而不是按
      异常字符串判定。门不放宽。
    gate: backend/tests/test_qoder_anywhere_provider_truth.py::test_g11_six_provider_shapes_must_not_collapse_into_one_reason_code

  count-is-not-capability:
    rule: >-
      READY 只能由带版本的服务端 readiness_policy 判定；要素总数只做诊断。B 实测塔什库尔干 255 要素、
      72% natural=peak、BAR=0 —— 这种形状不得整体 READY。
    gate: backend/tests/test_qoder_anywhere_provider_truth.py::test_g12_a_large_element_count_cannot_promote_a_destination_to_ready

  lock-duration-evidence:
    rule: >-
      必须有一门能量到或证明 provider HTTP 发生在 SQLite 写事务之外；顺序按 §6：
      短读 → 释放 session → 网络 → 短持久化事务 → 释放 → 下一阶段。
      stay-generation 那次 115 秒独占写锁不许重演：光把锁挪到别的线程不算过。
    shape: >-
      仪器本身要先自证能看见写事务（否则"零重叠"可能只是"零观测"）；
      再用并发探针证明水合跑网络期间，另一条旅程的 plans/generate 不被锁住。
    gate: backend/tests/test_qoder_anywhere_lock_duration.py

  matrix-units-must-be-pinned:
    rule: >-
      Valhalla 的 ``/route`` 与 ``/sources_to_targets`` 里 ``time`` 是**秒**、``length`` 与
      ``distance`` 是**公里**。产品在 valhalla_http.py:99 / :225 / :275 三处各除一次 60，
      仓库里没有任何东西钉住这个单位：漏除 ⇒ 20 分钟的腿报成 1200 分钟，多除 ⇒ 报成 1 分钟，
      两者看着都是一个正常数字。门的判据不是"我们也除了一遍"，是**步行速度带** 1.5–9.0 km/h
      （1.5 km / 20 分钟 = 4.5 km/h），单位一错必然出带。
    gate: backend/tests/test_qoder_anywhere_matrix_truth.py::test_g13_route_summary_time_is_seconds_and_becomes_minutes_not_seconds
    companion-gates:
      - backend/tests/test_qoder_anywhere_matrix_truth.py::test_g13b_both_matrix_shapes_convert_the_same_seconds_to_the_same_minutes
      - backend/tests/test_qoder_anywhere_matrix_truth.py::test_g13c_an_impossible_duration_is_refused_not_rescaled

  matrix-preflight-is-in-cells-not-locations:
    rule: >-
      出网前必须先算 cells = sources × targets，>100 就分片或明确拒绝；不得按 provider 错误文案里
      那个字面 "locations" 数预检。实测：N=10 ⇒ 100 cells / 200 / 1018 ms；N=11 ⇒ 121 cells / 400 /
      error_code 150。今天 runtime.py:232 把全部节点一次发出（N=20 ⇒ 400 cells），整次捕获 FAILED。
      分片还必须**不丢格**：只切第一片能骗过 ≤100 cells，骗不过"有序成对事实全覆盖"这一条。
    why-not-the-literal: >-
      今天的调用形状是方阵，cells 规则与 locations 规则恰好同解；换成 4×20=80 cells 的合法矩形，
      "locations ≤ 10" 就误拒了。所以这条门钉的是 cells，并把"按文案分类"单独钉死：两份 400 只有
      措辞不同（一份含 locations、一份不含），判定必须逐字段一致。
    gate: backend/tests/test_qoder_anywhere_matrix_truth.py::test_g14b_no_request_may_carry_more_than_100_cells_and_every_pair_survives
    companion-gates:
      - backend/tests/test_qoder_anywhere_matrix_truth.py::test_g14a_an_oversized_matrix_fails_closed_and_invents_no_facts
      - backend/tests/test_qoder_anywhere_matrix_truth.py::test_g14c_the_verdict_must_not_depend_on_the_providers_wording

  straight-line-distance-may-not-become-travel-minutes:
    rule: >-
      两点直线距离除一个速度常量，得到的分钟数没有来源，因此不得进入任何 travel_minutes 口径。
      一条腿没有事实时，产品必须逐腿说 MOBILITY_DATA_UNAVAILABLE，并在投影里把它从
      legs_hard_eligible 里掉出去（legs_total 不变）。allowlist（EXPLICIT_FROZEN_FIXTURE /
      LIVE_PROVIDER_CAPTURE）之外的一切来源标签 —— 含 None、含 SYNTHETIC_DEFAULT、含一个
      "看起来合理"的 6 分钟 —— 都不许被硬可行性采信。
    gate: backend/tests/test_qoder_anywhere_matrix_truth.py::test_g15a_a_leg_with_no_sourced_fact_has_no_number_at_any_door
    companion-gates:
      - backend/tests/test_qoder_anywhere_matrix_truth.py::test_g15b_no_great_circle_helper_reaches_a_travel_time_name
      - backend/tests/test_qoder_anywhere_matrix_truth.py::test_g15c_coverage_counts_the_unusable_leg_instead_of_guessing_it
      - backend/tests/test_qoder_anywhere_matrix_truth.py::test_g15d_the_scene_read_reports_the_same_two_counts

  cached-discovery-must-be-read-not-only-written:
    rule: >-
      settings.real_city_cache_ttl_seconds=900 只在 real_city.py:964-966 写 RealPlaceCandidate.expires_at、
      :1004 抄进 evidence_json，**全仓没有一处读它决定是否出网** ⇒ B 实测暖趟 242.9 s vs 冷趟 238.3 s。
      判据用计数 client：同一 journey + 同一 provider + 未过期 ⇒ 第二次外呼必须为 0，且第二次产出的候选
      不得变少；反向半边（过期之后必须回到 provider）同时钉住，免得"永远不出网"假装通过。
      仪器先自证：冷趟必须看到 ≥1 次外呼，否则那个 0 什么也不是。
    measured-on: fed1861
    finding: >-
      车道 F @fed1861 实测：冷趟 2 次外呼、落库 1 行且 expires_at 在未来；暖趟**仍然 2 次**
      （/search + /interpreter）⇒ 这条门今天红，且红得与 B 的秒数差同向。归后端（real_city.py 读侧）。
    gate: backend/tests/test_qoder_anywhere_discovery_truth.py::test_g16b_an_unexpired_candidate_set_must_answer_without_going_outside
    companion-gates:
      - backend/tests/test_qoder_anywhere_discovery_truth.py::test_g16a_the_counting_client_sees_every_outbound_call_or_the_zero_proves_nothing
      - backend/tests/test_qoder_anywhere_discovery_truth.py::test_g16c_an_expired_candidate_set_must_go_back_to_the_provider

  discovery-range-must-come-from-the-destination-extent:
    rule: >-
      real_city.py:716 的 around:{min(radius_m, 5000)} 把"水合一个县"变成"搜县城 5 公里圈"。
      门不规定写法（bbox / area 多边形 / 按 extent 算半径都行），只规定两件事：发出去的几何必须
      配得上调用方要的范围；两块不同尺度的目的地不得问出同一句话。等车道 C 的 ORD-0114 提供 extent。
    measured-on: fed1861
    finding: >-
