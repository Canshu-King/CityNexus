openapi: 3.1.0
#
# CITYNEXUS-ANYWHERE 契约 · 车道 F **附件**（ORD-0094 · 2026-09-21 13:5x）
# =============================================================================
# 这份文件原本是我（车道 F）写的目标契约草案。仲裁已在
# `arbiter/anywhere-contract` 上交付正式契约：
#   contracts/anywhere_v1.openapi.yaml  （commit `0c0aa82` "contract: define Anywhere
#   capability and hydration v1"，分支 tip `e49dfb1`，536 行 / 22 schema）
# 那份覆盖得更全（写事务规则、AgentOutcome、Provenance 的 source_kind 与 fact_quality
# 不许升级，都在里面）。**所以我不再重复登记端点与 schema** —— 同一件事留两份定义，
# 将来一定有一份在说谎。本文件降级为附件，只保留正式契约里没有、而 ORD-0094 要求的
# 四块内容：实测差集、延迟预算、§17C/D/E 的测试义务、以及逐条对照表。
#
# 正式契约落地到权威树之后，`backend/tests/test_qoder_anywhere_contract_parity.py`
# 会从"对照下面这张表里的字面量"切换成"直接解析 contracts/anywhere_v1.openapi.yaml"，
# 那份文件才是真值源；切换点写在同一个文件里，不用另找人记这件事。
info:
  title: CityNexus ANYWHERE contract annex (lane F) — authority lives in anywhere_v1.openapi.yaml
  version: 0.94-annex.1
  description: >-
    Measurements, latency budget, test obligations and the point-by-point reconciliation
    against the arbiter's Anywhere v1 contract. Defines no operations and no reusable
    schemas on purpose: the operations are the arbiter's, and a second copy here would be
    the next "the contract says one thing, the code another" incident.
  x-authority:
    branch: arbiter/anywhere-contract
    contract-file: contracts/anywhere_v1.openapi.yaml
    introduced-by: 0c0aa82
    branch-tip-observed: e49dfb1
    observed-at: "2026-09-21 13:5x +0800, read-only: git ls-remote --heads + git fetch + git ls-tree/git show (working tree untouched)"
  x-status: annex-of-arbiter-contract
  x-authored-by: "lane F (session 8ccd71d8) · ORD-0094 · authoritative HEAD 4c8c911"

  # -----------------------------------------------------------------------------
  # ① 实测差集：契约里有、实现里没有 —— 四条全缺，且是活进程量出来的
  # -----------------------------------------------------------------------------
  x-differential-evidence:
    measured-at: "2026-09-21 13:32:17 +0800 (machine clock)"
    server: "lane F's own uvicorn on 127.0.0.1:8652, own sqlite file D:/moodle/_qoder_f_run/_runF1.db, CITYNEXUS_DEMO_MODE=true, AI off, provider credentials cleared, code = 4c8c911"
    interpreter: "D:/moodle/CityNexus/.venv/Scripts/python.exe (3.12.14)"
    method: "curl -w '%{http_code}' plus the body, against the running process"
    targets:
      - "GET  /api/v1/destinations/capability?query=贡山独龙族怒族自治县 -> 404 {\"detail\":\"Not Found\"}"
      - "POST /api/v1/catalog-hydrations                                 -> 404 {\"detail\":\"Not Found\"}"
      - "GET  /api/v1/catalog-hydrations/{uuid}                          -> 404 {\"detail\":\"Not Found\"}"
      - "POST /api/v1/catalog-hydrations/{uuid}/abandon                  -> 404 {\"detail\":\"Not Found\"}"
    controls-same-process-same-minute:
      - "GET /api/v1/health      -> 200"
      - "GET /api/v1/demo/scene  -> 200"
    reading: >-
      Four for four absent while the very same process answers 200 on two other routes, so
      these are router-level absences, not a server that was down. Re-measurable by anyone:
      run backend/tests/test_qoder_anywhere_contract_parity.py.

  # -----------------------------------------------------------------------------
  # ② 对照表：哪条按仲裁的、哪条按车道 F 的
  # -----------------------------------------------------------------------------
  x-reconciliation:
    follows-arbiter:
      - "端点集合与 operationId：POST /catalog-hydrations 定为 createOrReuseCatalogHydration（我草案里叫 createCatalogHydration）—— 名字本身就写了'或复用'，按它。"
      - "能力裁决字段名 `capability`（我草案叫 state）；枚举 READY|HYDRATABLE|UNAVAILABLE 三值，按它。"
      - "我草案里私自加的第四个态 `UNKNOWN` 撤掉：'量不出来'走 ReasonCode（DESTINATION_RESOLVER_UNAVAILABLE / NO_TRACEABLE_CATALOG_SOURCE），不扩状态枚举。"
      - "覆盖度：DestinationCoverage 六键 attractions/food/nightlife/lodging/mobility/booking，取值 READY|PARTIAL|MISSING（我多写的 UNKNOWN 撤掉），按它。"
      - "水合操作是**双轴**：status（QUEUED|RUNNING|COMPLETED|FAILED|UNAVAILABLE|ABANDON_REQUESTED|ABANDONED）+ phase（QUEUED…FINALIZING）。我草案只有一条 phase，会分不清'放弃了但还在跑'与'跑完了'，按它。"
      - "必填字段表：operation_id/fingerprint/reused/status/phase/elapsed_ms/retry_after_ms/status_url/abandon_url 全 required；我草案把 reused 写成可选，按它。"
      - "Provenance 是对象不是单词：source_kind ∈ GOLDEN_FIXTURE|REMOTE_PROVIDER|SIMULATED|REPLAY|OFFLINE_SNAPSHOT，外加 fact_quality 且'归一化不得把 SIMULATED/PARTIAL/未知升成更强类'。我草案那套平铺 enum 作废，按它。"
      - "ReasonCode 取它的 9 值；RecommendedAction 取它的 7 值（我草案里的 CHOOSE_CANDIDATE 撤，歧义由 candidates/AMBIGUOUS 路径表达）；ProviderStatus 取它的 OK|RATE_LIMITED|UNREACHABLE|PARTIAL。"
      - "响应码：POST /catalog-hydrations 是 200/202/422/503（我写了 409，按它改成 422/503 分工）。"
      - "capability 只接 `query` 一个参数（我加的 journey_id 撤）：绑定旅程发生在 POST /catalog-hydrations 的请求体里，它已带 journey_id/canonical_destination_id/requested_categories。"
    lane-f-additions:
      - "① 实测差集（正式契约不记录现实，只规定应然；这份把'四条全缺 + 同一进程对照 200'钉成可复跑读数）。"
      - "② 延迟预算 p95<=1s / hard<=2s（§6 的数在两边都没写成字段约束，这里定成可断言形式）。"
      - "③ §17C/D/E 三条测试义务（下面 x-testing-obligations），正式契约只写了'provider 网络不得持写事务'这一条规则，没规定怎么证明。"
      - "④ 双向 parity：实现了却还把契约挂着未登记 ⇒ 红。防的正是这份附件被长期留在'草案'状态。"
    open-questions-for-arbiter:
      - "`stale_after` 与 `readiness_policy_version` 的关系：READY 是否随 stale_after 过期自动降级为 HYDRATABLE，还是仍报 READY + 背景刷新（§8 的 stale-while-refresh 两种都讲得通）。车道 C 需要一句话定死，我先按'不自动降级，但必须把 stale 说出来'实现门。"
      - "UNAVAILABLE 与 503 的分界：目的地本身不可用 vs provider 解析器不可用，前者进 capability、后者进 HTTP 码，两边没写死。"

  # -----------------------------------------------------------------------------
  # ③ §6 的延迟预算（可断言形式）
  # -----------------------------------------------------------------------------
x-latency-budget:
  post-acceptance-p95-ms: 1000
  post-acceptance-hard-ms: 2000
  measured-by: "CatalogHydrationOperation.elapsed_ms 之外，门侧另算墙钟：受理段不含任何 provider 调用"
  note: "拿不出这个数字就等于没满足它（规则：先测量再宣称）。"

# -----------------------------------------------------------------------------
# ④ §17C / §17D / §17E 测试义务（Commander 13:4x 补发的三条，最容易漏）
# -----------------------------------------------------------------------------
x-testing-obligations:
  suite-must-not-depend-on-live-providers:
    rule: >-
      常规后端套件（900+ 条）一律走确定性 fixture/mock，不许真打 photon.komoot.io /
      overpass-api.de / overpass.private.coffee / overpass.kumi.systems /
      nominatim.openstreetmap.org / restapi.amap.com / api.open-meteo.com /
      api.deepseek.com（域名清单抄自 app/integrations/**，不是猜的）。
    mechanism: >-
      默认收集范围内不得出现对这些主机的真实出网；live 验证单独放
      backend/tests/live/，必须显式 CITYNEXUS_LIVE_PROVIDER_SMOKE=1 才跑，且跑时必须
      落盘：环境、出口（哪张网卡/哪个链路）、每次请求耗时与状态、原始响应路径。
      opt-in 的实现方式不是 skip —— 未开开关时它**响亮地失败**（RC != 0 + 指名原因），
      这样"忘了跑 live"不会被读成"live 已过"。
    gate: backend/tests/test_qoder_anywhere_provider_independence.py
  durable-idempotency-and-concurrency:
    rule: >-
      2~5 个同指纹并发必须收敛到同一个 operation_id；持久层同一指纹的非终态操作**至多一条**，
      由唯一索引强制（不是进程内锁 —— 两个 uvicorn worker 不共享一把锁）；
      provider 调用不得因并发而翻倍；`reused=true` 必须如实。
    fingerprint: canonical destination + catalog_schema_version + provider policy/version
    gate: backend/tests/test_qoder_anywhere_gates.py::test_g3_five_concurrent_hydrations_of_one_county_converge_on_one_operation
  lock-duration-evidence:
    rule: >-
      必须有一门能量到或证明 provider HTTP 发生在 SQLite 写事务之外；顺序按 §6：
      短读 → 释放 session → 网络 → 短持久化事务 → 释放 → 下一阶段。
      stay-generation 那次 115 秒独占写锁不许重演：光把锁挪到别的线程不算过。
    shape: >-
      仪器本身要先自证能看见写事务（否则"零重叠"可能只是"零观测"）；
      再用并发探针证明水合跑网络期间，另一条旅程的 plans/generate 不被锁住。
    gate: backend/tests/test_qoder_anywhere_lock_duration.py
paths: {}
