      实现里有一处具名缺陷（多半是一行参数/一个分支缺失），门只是把它照出来。
    shared-infra-missing: >-
      端点或读侧还没落地，门已经先站住；这类红会随对应订单自己退掉。
    suite-order-dependent: >-
      单跑绿、全量红 —— 环境/顺序敏感，不是产品结论；按 Commander 的
      FULL_SUITE_ENVIRONMENT_SENSITIVITY 口径处理，既不许当缺陷也不许当噪声藏掉。
