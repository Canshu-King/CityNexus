        active_plan_version_id: {type: [string, 'null'], format: uuid}
        current_activity_id: {type: [string, 'null'], format: uuid}
    RecycleBinJourney:
      description: >-
        ORD-0402 slice 1: a journey as `getJourney` answers it, plus the two bin facts read from
        `journeys.deleted_at`.  `deleted_at` is never null in this shape - a row with no deletion
        moment belongs to `listJourneys`, not to the bin - and `bin_state` has one value so a
        screen never reconstructs "it was deleted" from absence in another list.
      allOf:
        - {$ref: '#/components/schemas/Journey'}
        - type: object
          required: [deleted_at, bin_state]
          properties:
            deleted_at: {type: string, format: date-time}
            bin_state: {type: string, enum: [IN_RECYCLE_BIN]}
    MemberRole:
      type: string
      description: >-
        Three tiers, each answering what that person may do through the ACL door below.  The words
        are checked in the store too (`backend/db/schema.sql`).
      enum: [OWNER, ADMIN, COLLABORATOR]
    MemberState:
      type: string
      description: >-
        Derived from the row's own columns, never stored.  Prefixed because bare EXPIRED and WITHDRAWN
        already mean something to accommodation offers (`backend/app/stay_mobility.py:1963`).
      enum: [MEMBER_IN_FORCE, MEMBER_LAPSED, MEMBER_WITHDRAWN]
    JourneyCapability:
      type: string
      enum: [JOURNEY_READ, JOURNEY_UPDATE, PLACE_EDIT, MEMBER_MANAGE, SHARE_GRANT_MANAGE]
    JourneyMemberCreate:
