          description: Server-assigned for public events; arbitrary provider identities are rejected.
        provenance:
          type: string
          enum: [SIMULATED, PROVIDER_VERIFIED, USER_REPORTED, SYSTEM_DERIVED]
          default: SIMULATED
          description: Trusted provenance values are accepted only through server-side ingestion.
        event_type: {type: string, enum: [TRAFFIC_DELAY, CLOSURE, WEATHER, SCHEDULE_DELAY, SERVICE_UNAVAILABLE, USER_CHANGE, OTHER]}
        severity: {type: string, enum: [INFO, MINOR, MAJOR, CRITICAL]}
        affected_activity_id: {type: [string, 'null'], format: uuid}
        occurred_at:
          type: [string, 'null']
          format: date-time
          description: Simulator clients should provide this explicitly; omission uses deterministic journey time.
        payload: {type: object, additionalProperties: true, default: {}}
    Event:
      allOf:
        - {$ref: '#/components/schemas/EventCreate'}
        - type: object
          required: [id, journey_id, provider_key, provenance, status, detected_at]
          properties:
            id: {type: string, format: uuid}
            journey_id: {type: string, format: uuid}
            status: {type: string, enum: [DETECTED, ACKNOWLEDGED, RESOLVED, IGNORED]}
            detected_at: {type: string, format: date-time}
    Commitment:
      type: object
      required: [id, journey_id, kind, level, status]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        activity_id: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [BOOKING, ORDER, PAYMENT, APPOINTMENT, OTHER]}
        level: {type: string, enum: [C0_Flexible, C1_Preferred, C2_Reserved, C3_Guaranteed, C4_Anchored]}
        status: {type: string, enum: [PROPOSED, ACTIVE, FULFILLED, CANCELLED, BREACHED]}
        monetary_value: {$ref: '#/components/schemas/Money'}
        external_ref: {type: [string, 'null']}
        policy: {type: object, additionalProperties: true}
    ReplanProposal:
      type: object
      required: [id, journey_id, base_plan_version_id, proposed_plan_version_id, status, hard_constraints_passed, locked_commitments_preserved, utility_score, score_breakdown, diff, explanation]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        trigger_event_id: {type: [string, 'null'], format: uuid}
        base_plan_version_id: {type: string, format: uuid}
        proposed_plan_version_id: {type: string, format: uuid}
        status: {type: string, enum: [GENERATED, PRESENTED, ACCEPTED, REJECTED, EXPIRED, INVALIDATED]}
        hard_constraints_passed: {type: boolean}
        locked_commitments_preserved: {type: boolean}
        utility_score: {type: number, minimum: 0, maximum: 1}
        score_breakdown: {$ref: '#/components/schemas/ScoreBreakdown'}
        diff: {type: object, additionalProperties: true}
        explanation:
          type: object
          required: [summary, reasons]
          properties:
            summary: {type: string}
            reasons: {type: array, items: {type: string}}
            source: {type: string, enum: [DETERMINISTIC, AI, HYBRID]}
    WeatherRuntimeRefresh:
      type: object
      required:
        - provider
        - queried_place_ids
        - successful_place_ids
        - failed_place_ids
        - degraded
        - snapshots
        - attributions
        - event_ids
        - created_event_ids
      properties:
        provider: {type: string, const: open-meteo}
        queried_place_ids: {type: array, items: {type: string}}
        successful_place_ids: {type: array, items: {type: string}}
        failed_place_ids: {type: array, items: {type: string}}
        degraded: {type: boolean}
        snapshots: {type: array, items: {type: object, additionalProperties: true}}
        attributions: {type: array, items: {type: object, additionalProperties: true}}
        event_ids: {type: array, items: {type: string, format: uuid}}
        created_event_ids: {type: array, items: {type: string, format: uuid}}
    FeasibilityEnvelope:
      type: object
      description: >-
        What this journey can still honour, recomputed on every twin read. ORD-0432: an event whose
        severity is MAJOR or CRITICAL and whose status is still DETECTED or ACKNOWLEDGED has to
        appear in `risk_reason_codes`, and `robust` is false while any risk code is present -- an
        open disruption must never read as nothing-to-see. `next_commitment_buffer_min` is null when
        no later commitment is scheduled, so the field simply does not gate that trip.
      required: [journey_end_slack_min, budget_remaining_minor, preserved_commitment_count,
                 degraded_providers, risk_reason_codes, robust]
      properties:
        next_commitment_buffer_min: {type: [integer, 'null']}
        journey_end_slack_min: {type: integer}
        budget_remaining_minor: {type: integer}
        preserved_commitment_count: {type: integer}
        degraded_providers: {type: array, items: {type: string}}
        risk_reason_codes:
          type: array
          items:
            type: string
            enum: [PROVIDER_DEGRADED, DISRUPTION_MAJOR, DISRUPTION_CRITICAL]
        robust: {type: boolean}
    JourneyTwin:
      type: object
      required: [journey_id, projection_status, snapshot_at]
      properties:
        journey_id: {type: string, format: uuid}
        active_plan_version_id: {type: [string, 'null'], format: uuid}
        current_activity_id: {type: [string, 'null'], format: uuid}
        latest_event_id: {type: [string, 'null'], format: uuid}
        projection_status: {type: string, enum: [READY, STALE, DEGRADED]}
        snapshot_at: {type: string, format: date-time}
        upcoming_commitments:
          type: array
          items: {$ref: '#/components/schemas/Commitment'}
        context:
          type: object
          additionalProperties: true
          properties:
            feasibility_envelope: {$ref: '#/components/schemas/FeasibilityEnvelope'}
    ReplanAcceptance:
      type: object
      required: [journey, proposal, twin]
      properties:
        journey: {$ref: '#/components/schemas/Journey'}
        proposal: {$ref: '#/components/schemas/ReplanProposal'}
        twin: {$ref: '#/components/schemas/JourneyTwin'}
    HistoryItem:
      type: object
      required: [timestamp, type, summary]
      properties:
        timestamp: {type: string, format: date-time}
        type: {type: string}
        summary: {type: string}
        entity_id: {type: [string, 'null']}
    AgentFeedEntry:
      type: object
      required: [id, timestamp, event_type, summary, actor_type, reason_codes, facts]
      properties:
        id: {type: string, format: uuid}
        timestamp: {type: string, format: date-time}
        event_type: {type: string}
        type: {type: string}
        summary: {type: string}
        actor_type: {type: string}
        actor_id: {type: [string, 'null']}
        tool: {type: [string, 'null']}
        journey_id: {type: [string, 'null'], format: uuid}
        proposal_id: {type: [string, 'null'], format: uuid}
        entity_type: {type: [string, 'null']}
        entity_id: {type: [string, 'null']}
        decision: {type: [string, 'null']}
        reason_codes:
          type: array
          items: {type: string}
        trace_id: {type: string}
        source: {type: string}
        facts: {type: object, additionalProperties: true}
    AgentFeedResponse:
      type: object
      required: [journey_id, source, events]
      properties:
        journey_id: {type: string, format: uuid}
        source: {type: string}
        events:
          type: array
          items: {$ref: '#/components/schemas/AgentFeedEntry'}
    RouteEvidence:
      type: object
      required: [journey_id, proposal_id, frozen, old_route, markers, fallback, source]
      properties:
        journey_id: {type: string, format: uuid}
        proposal_id: {type: [string, 'null'], format: uuid}
        snapshot_id: {type: [string, 'null'], format: uuid}
        provider: {type: string}
        frozen: {type: boolean}
        old_route: {type: object, additionalProperties: true}
        new_route: {type: [object, 'null'], additionalProperties: true}
        disruption_scope: {type: [object, 'null'], additionalProperties: true}
        impacted_activity_ids:
          type: array
          items: {type: string}
        markers: {type: object, additionalProperties: true}
        fallback: {type: boolean}
        fallback_reason: {type: [string, 'null']}
        source: {type: string}
    ReflectSummary:
      type: object
      required: [journey_id, status, completed, timeline, replan_history, agent_action_history, provider_disruptions, cost_summary, plan_version_chain, preference_feedback_hook]
      properties:
        journey_id: {type: string, format: uuid}
        status: {type: string}
        completed: {type: boolean}
        timeline: {type: object, additionalProperties: true}
        replan_history:
          type: array
          items: {type: object, additionalProperties: true}
        agent_action_history:
          type: array
          items: {$ref: '#/components/schemas/AgentFeedEntry'}
        provider_disruptions:
          type: array
          items: {type: object, additionalProperties: true}
        cost_summary: {type: object, additionalProperties: true}
        plan_version_chain:
          type: array
          items: {type: object, additionalProperties: true}
        preference_feedback_hook: {type: object, additionalProperties: true}
    CopilotResponse:
      type: object
      required: [message, mode, verified_context_used, intent, action, what_if, protected_commitments, evidence]
      properties:
        message: {type: string}
        mode: {type: string, enum: [AI, FALLBACK]}
        verified_context_used: {type: boolean}
        intent:
          type: object
          required: [name, confidence, reason, entities, provider, mode]
          properties:
            name: {type: string, enum: [EXPLAIN_PLAN, WHAT_IF, DISCOVER, PREFERENCE_CHANGE, DISRUPTION_REPORT, REPLAN_REQUEST, UNKNOWN]}
            confidence: {type: number, minimum: 0, maximum: 1}
            reason: {type: string}
            entities: {type: object, additionalProperties: true}
            provider: {type: string}
            mode: {type: string, enum: [AI, FALLBACK]}
        action:
          oneOf:
            - type: object
              properties: {type: {type: string}}
            - type: "null"
        what_if:
          oneOf:
            - type: object
              required: [simulation_only, status, feasibility, before, after, deltas, protected_commitments, provenance, explanation]
              properties:
                simulation_only: {type: boolean, const: true}
                status: {type: string}
                feasibility: {type: string}
                before: {type: object, additionalProperties: true}
                after: {type: object, additionalProperties: true}
                deltas: {type: object, additionalProperties: true}
                affected_activities: {type: array, items: {type: object, additionalProperties: true}}
                protected_commitments: {type: object, additionalProperties: true}
                proposed_changes: {type: array, items: {type: object, additionalProperties: true}}
                provenance: {type: object, additionalProperties: true}
                explanation: {type: string}
                next_action: {type: [string, "null"]}
            - type: "null"
        event: {type: [object, "null"], additionalProperties: true}
        protected_commitments: {type: array, items: {type: object, additionalProperties: true}}
        evidence: {type: object, additionalProperties: true}
        recommendations:
          type: array
          items: {type: object, additionalProperties: true}

    PlanDeltaSlotStamp:
      type: object
      description: A slot reduced to the columns the map and the ledger need, with no judgement added here.
      required: [sequence_no, place_id, start_at, end_at, estimated_cost_minor, currency, status]
      properties:
        sequence_no: {type: integer}
        place_id: {type: [string, "null"], format: uuid}
        start_at: {type: string}
        end_at: {type: string}
        estimated_cost_minor: {type: integer}
        currency: {type: string}
        status: {type: string}
    PlanDeltaPoint:
      type: object
      description: One place a map must draw or drop, carrying the fact door's own coordinate answer.
      required: [sequence_no, place_id, source_identity, label, coordinate, media_door]
      properties:
        sequence_no: {type: integer}
        place_id: {type: [string, "null"], format: uuid}
        source_identity: {type: [string, "null"]}
        label: {type: string}
        coordinate:
          type: object
          required: [state, reason, coordinate_system]
          properties:
            state: {type: string, enum: [READY, UNAVAILABLE]}
            reason: {type: [string, "null"]}
            coordinate_system: {type: [string, "null"]}
        media_door: {type: [string, "null"]}
    PlanDeltaSetEntry:
      type: object
      description: >
        One row of `sets`. `from`/`from_slot` are absent for an added slot and `to`/`to_slot` for a
        removed one, which is why they are optional here rather than null.
      required: [sequence_no]
      properties:
        sequence_no: {type: integer}
        kind:
          type: string
          description: Only kept slots state a kind, so a place-less keep is not read as a move.
          enum: [KEPT, KEPT_WITHOUT_PLACE]
        from: {$ref: '#/components/schemas/PlanDeltaSlotStamp'}
        to: {$ref: '#/components/schemas/PlanDeltaSlotStamp'}
        from_slot: {$ref: '#/components/schemas/DepartureFactsSlot'}
        to_slot: {$ref: '#/components/schemas/DepartureFactsSlot'}
    DepartureFactsSlot:
      description: One slot as app.departure_facts._slot answers it, which is the only
        view a plan delta may carry, so the two doors cannot disagree about the same row.
      type: object
      required: [activity_id, sequence_no, title, location_kind, identity,
                 coordinate, opening_hours, cost, fact_retrieved_at, media_door]
      properties:
        activity_id: {type: string, format: uuid}
        sequence_no: {type: integer}
        activity_type: {type: string}
        title: {type: string}
        starts_at: {type: string}
        ends_at: {type: string}
        locked: {type: boolean}
        status: {type: string}
        location_kind: {type: string, enum: [PLACE, CITY_SERVICE, NONE]}
        identity:
          type: object
          required: [canonical_id, provider_key, external_id, source_identity, detail]
          properties:
            canonical_id: {type: [string, "null"], format: uuid}
            provider_key: {type: [string, "null"]}
            external_id: {type: [string, "null"]}
            source_identity: {type: [string, "null"]}
            detail: {type: [string, "null"]}
        coordinate:
          type: object
          required: [state, reason, coordinate_system]
          properties:
            state: {type: string, enum: [READY, UNAVAILABLE]}
            reason: {type: [string, "null"]}
            coordinate_system: {type: [string, "null"]}
        opening_hours:
          type: object
          required: [state, detail, open_minutes, close_minutes]
          properties:
            state: {type: string, enum: [KNOWN, UNKNOWN]}
            detail: {type: [string, "null"]}
            open_minutes: {type: [integer, "null"]}
            close_minutes: {type: [integer, "null"]}
        cost:
          type: object
          required: [state, detail, verified_amount_minor, activity_estimate_minor,
                     currency]
          properties:
            state: {type: string, enum: [KNOWN, UNKNOWN]}
            detail: {type: [string, "null"]}
            verified_amount_minor: {type: [integer, "null"]}
            activity_estimate_minor: {type: integer}
            currency: {type: string}
        fact_retrieved_at: {type: [string, "null"]}
        media_door: {type: [string, "null"]}

    PlanCandidateSubmission:
      type: object
      required: [journey_id, proposal_id, base_plan_version_id, proposed_plan_version_id, base_status,
                 status, submitted_by_traveler_id, created_at, hard_constraints_passed, gate,
                 evidence_gap, evidence_basis, locked_commitments_preserved, locked_slots_dropped,
                 lock_flags_dropped, lock_flags_added, currency,
                 utility_score, score_breakdown, envelope, delta, applied, shared_plan_updated,
                 journey_active_plan_version_id, consent_path, next_actions]
      properties:
        journey_id: {type: string, format: uuid}
        proposal_id: {type: string, format: uuid}
        base_plan_version_id: {type: string, format: uuid}
        proposed_plan_version_id: {type: string, format: uuid}
        base_status: {type: string}
        status: {type: string, const: PRESENTED}
        submitted_by_traveler_id: {type: string, format: uuid}
        created_at: {type: string}
        idempotency_replay:
          type: boolean
          description: Absent on the first press, true on a replay of the same key and content.
        hard_constraints_passed:
          type: boolean
          description: The gate's own answer; false also covers "the gate refused to judge", which
            `gate.judged` states, because the shipped column cannot hold a null.
        gate:
          type: object
          required: [judged, passed, failures, refusal_code, refusal_detail]
          properties:
            judged: {type: boolean}
            passed: {type: boolean}
            failures: {type: array, items: {type: string}}
            refusal_code: {type: [string, "null"]}
            refusal_detail: {type: [string, "null"]}
        evidence_gap: {type: boolean}
        evidence_basis:
          description: >
            Whose legs the gate was handed, read through `app.services._snapshot_for_plan` (the gate's own
            loader) and tallied by `app.replanning.provider_snapshots.fact_quality_summary` (the freeze
            door's own function), so the two doors cannot disagree about the same frozen snapshot. null for
            a candidate with nothing frozen -- the same absence `gate.judged` false reports, never a zero.
            `hard_eligible_legs` counts the legs the shipped allowlist `MobilitySnapshot.hard_minutes` would
            admit into a hard decision. The gate's travel arithmetic reads the raw `estimate_minutes`
            (`app/replanning/feasibility.py`) instead, so this count is a disclosure and not a second
            verdict: a round can be `gate.passed` true with `hard_eligible_legs` 0, and a candidate written
            by `from-slots` on the mock provider is exactly that.
          anyOf:
            - type: object
              required: [frozen, snapshot_id, source_provider, captured_at, fact_qualities, legs_frozen,
                         hard_eligible_legs, read_from]
              properties:
                frozen: {type: boolean, const: true}
                snapshot_id: {type: string}
                source_provider: {type: string}
                captured_at: {type: string}
                fact_qualities: {type: object, additionalProperties: {type: integer}}
                legs_frozen: {type: integer}
                hard_eligible_legs: {type: integer}
                read_from: {type: string, const: app.replanning.provider_snapshots.fact_quality_summary}
            - type: "null"
        locked_commitments_preserved: {type: boolean}
        locked_slots_dropped: {type: array, items: {type: integer}}
        lock_flags_dropped: {type: array, items: {type: integer}}
        lock_flags_added: {type: array, items: {type: integer}}
        currency: {type: string}
        utility_score: {type: number, minimum: 0, maximum: 1}
        score_breakdown: {type: object, additionalProperties: {type: number}}
        envelope:
          type: object
          description: The envelope app.main._envelope_payload builds from the candidate's own rows.
          additionalProperties: true
        delta: {$ref: '#/components/schemas/PlanDeltaDifference'}
        applied: {type: boolean, const: false}
        shared_plan_updated: {type: boolean, const: false}
        journey_active_plan_version_id: {type: [string, "null"], format: uuid}
        consent_path: {type: string}
        next_actions:
          type: array
          description: >
            Two pointers when the candidate's evidence is already frozen, three when it is not: the first
            is then `POST .../mobility-freeze`, because the round this press opens cannot be judged until
            the gate is handed something to judge.
          minItems: 2
          maxItems: 3
          items: {type: string}

    PlanDeltaEvidenceSide:
      type: object
      description: The gate answer the select door compares, read through departure_read.frozen_evidence_of.
      required: [frozen, snapshot_id, expires_at, expired, detail, reference_consistent]
      properties:
        frozen: {type: boolean}
        snapshot_id: {type: [string, "null"]}
        expires_at: {type: [string, "null"]}
        expired: {type: [boolean, "null"]}
        detail: {type: [string, "null"]}
        reference_consistent: {type: [boolean, "null"]}
    PlanCandidateMobilityFreeze:
      type: object
      required: [journey_id, plan_version_id, status, mobility_snapshot_id, replaces_snapshot_id,
                 source_provider, operation_key, captured_at, expires_at, degraded, counts,
                 fact_qualities, provider_capabilities, sequences_without_a_location_row,
                 same_place_consecutive_transitions,
                 evidence_columns, read_from, next_actions, idempotency_key, written_at]
      properties:
        journey_id: {type: string, format: uuid}
        plan_version_id: {type: string, format: uuid}
        status:
          type: string
          const: CANDIDATE
          description: This door writes evidence onto a candidate and changes no status anywhere.
        mobility_snapshot_id: {type: string, format: uuid}
        replaces_snapshot_id:
          type: [string, "null"]
          description: The snapshot id this press overwrote; null when the candidate had none.
        source_provider:
          type: string
          description: The provider key the capture domain actually used, carried verbatim.
        operation_key: {type: string}
        captured_at: {type: string}
        expires_at:
          type: [string, "null"]
          description: Read out of the stored evidence document rather than asserted -- neither shipped
            arm of the capture domain writes an expiry, so the gate's staleness rule never sees one.
        degraded: {type: boolean}
        counts:
          type: object
          required: [slots, distinct_places, legs_requested, legs_frozen, hard_eligible_legs,
                     fallback_legs, slots_without_a_location_row, same_place_consecutive_transitions]
          properties:
            slots: {type: integer, minimum: 0}
            distinct_places: {type: integer, minimum: 0}
            legs_requested:
              type: integer
              minimum: 0
              description: Ordered place pairs this plan's own slots imply -- what a configured
                provider is asked for, so the cost of the press is visible before it is spent again.
            legs_frozen: {type: integer, minimum: 0}
            hard_eligible_legs:
              type: integer
              minimum: 0
              description: Legs tagged EXPLICIT_FROZEN_FIXTURE or LIVE_PROVIDER_CAPTURE. Kept apart
                from `legs_frozen` because the fixture's blanket constant is not a measurement.
            fallback_legs: {type: integer, minimum: 0}
            slots_without_a_location_row: {type: integer, minimum: 0}
            same_place_consecutive_transitions:
              type: integer
              minimum: 0
              description: Consecutive slots naming one place. The capture domain freezes
                no fact for a pair whose origin equals its destination, so each such step is
                one the shipped gate will refuse to price.
        fact_qualities:
          type: object
          additionalProperties: {type: integer, minimum: 0}
          description: How many legs came back under each provenance word, counted from the frozen
            facts themselves.
        provider_capabilities:
          type: object
          description: The live arm's own capability read; empty on the offline arm, which fills none.
        sequences_without_a_location_row: {type: array, items: {type: integer}}
        same_place_consecutive_transitions:
          type: array
          items:
            type: object
            required: [from_sequence_no, to_sequence_no, place_id]
            properties:
              from_sequence_no: {type: integer}
              to_sequence_no: {type: integer}
              place_id: {type: string, format: uuid}
          description: >
            Which steps ask for a leg from a place to that same place, named by the two
            sequence numbers and the canonical place row. This door writes no self leg and does
            not soften the gate -- it says, at the moment of freezing, that such a plan cannot
            be committed until the mobility rule names a zero-minute self leg.
        evidence_columns: {type: array, items: {type: string}}
        read_from:
          type: object
          required: [capture, columns, consumed_by]
          properties:
            capture: {type: string}
            columns: {type: string}
            consumed_by: {type: string}
        next_actions: {type: array, items: {type: string}}
        idempotency_key: {type: string}
        written_at: {type: string}
        idempotency_replay:
          type: boolean
          description: Absent on the first press, true on a replay of the same key.

    PlanDeltaDifference:
      description: The difference itself -- what `app.plan_delta.delta_of` emits. The
        read door answers with it and the submission door stores it, so a plan change has
        one arithmetic and not two.
      required: [journey_id, from_plan_version_id, to_plan_version_id, from_status, to_status, from_version_no, to_version_no, counts, sets, map_delta, budget_delta, verified_cost, duration_delta, evidence]
      properties:
        journey_id: {type: string, format: uuid}
        from_plan_version_id: {type: string, format: uuid}
        to_plan_version_id: {type: string, format: uuid}
        from_status: {type: string}
        to_status: {type: string}
        from_version_no: {type: integer}
        to_version_no: {type: integer}
        counts:
          type: object
          required: [from_slots, to_slots, kept, moved, added, removed]
          properties:
            from_slots: {type: integer}
            to_slots: {type: integer}
            kept: {type: integer}
            moved: {type: integer}
            added: {type: integer}
            removed: {type: integer}
        sets:
          type: object
          description: >
            The four sets, each ordered by `sequence_no`. A slot that moved names both halves, so a
            screen draws one arrow instead of inferring a pair from an add and a remove.
          required: [kept, moved, added, removed]
          properties:
            kept: {type: array, items: {$ref: '#/components/schemas/PlanDeltaSetEntry'}}
            moved: {type: array, items: {$ref: '#/components/schemas/PlanDeltaSetEntry'}}
            added: {type: array, items: {$ref: '#/components/schemas/PlanDeltaSetEntry'}}
            removed: {type: array, items: {$ref: '#/components/schemas/PlanDeltaSetEntry'}}
        map_delta:
          type: object
          required: [points_added, points_removed, coordinate_states]
          properties:
            points_added: {type: array, items: {$ref: '#/components/schemas/PlanDeltaPoint'}}
            points_removed: {type: array, items: {$ref: '#/components/schemas/PlanDeltaPoint'}}
            coordinate_states:
              type: object
              description: >
                Counted by the state word the fact door answered with, so a state this module did not
                imagine appears under its own name instead of being folded into UNAVAILABLE.
              additionalProperties: {type: integer}
        budget_delta:
          type: object
          description: The numbers the plan rows carry, not a provider's opinion of them.
          required: [from_total_minor, to_total_minor, delta_minor, currency,
                     mixed_or_missing_currency, read_from]
          properties:
            from_total_minor: {type: integer}
            to_total_minor: {type: integer}
            delta_minor: {type: [integer, "null"]}
            currency: {type: [string, "null"]}
            mixed_or_missing_currency: {type: boolean}
            read_from: {type: string, const: activities.estimated_cost_minor}
        verified_cost:
          type: object
          required: [from_total_minor, to_total_minor, delta_minor, priced_slots, unpriced_slots,
                     read_from]
          properties:
            from_total_minor: {type: integer}
            to_total_minor: {type: integer}
            delta_minor: {type: integer}
            priced_slots: {type: integer}
            unpriced_slots: {type: integer}
            read_from: {type: string, const: app.services._place_verified_cost}
        duration_delta:
          type: object
          required: [from_minutes, to_minutes, delta_min, from_unreadable_slots,
                     to_unreadable_slots, read_from]
          properties:
            from_minutes: {type: integer}
            to_minutes: {type: integer}
            delta_min: {type: integer}
            from_unreadable_slots: {type: integer}
            to_unreadable_slots: {type: integer}
            read_from: {type: string, const: activities.start_at / end_at}
        evidence:
          type: object
          required: [from, to, read_from]
          properties:
            from: {$ref: '#/components/schemas/PlanDeltaEvidenceSide'}
            to: {$ref: '#/components/schemas/PlanDeltaEvidenceSide'}
            read_from: {type: string, const: app.departure_read.frozen_evidence_of}

    PlanDeltaAnswer:
      allOf:
        - {$ref: '#/components/schemas/PlanDeltaDifference'}
        - type: object
          required: [asked_by_traveler_id, no_material_change, next_actions]
          properties:
            asked_by_traveler_id: {type: string, format: uuid}
            no_material_change:
              type: boolean
              description: >
                `app.plan_submission`'s own verdict for this pair: true when the two versions carry the
                same places, instants, money and commitments, which is the state the submission door
                refuses as `SUBMISSION_NO_MATERIAL_CHANGE` instead of opening a round about nothing. A
                difference confined to `activities.status` does not count, so this reads true for the
                plan in force echoed back after a journey has departed.
            next_actions:
              type: array
              items: {type: string}

