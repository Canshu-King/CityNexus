  /journeys/{journey_id}/places/{place_id}/media:
    parameters:
      - name: journey_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: place_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getJourneyPlaceMedia
      description: >
        The photograph this product may show for one place, with the identity evidence that bound it.
        A place that exists but has no showable photograph answers 200 with NO_IMAGE, NO_PERMISSION or
        UNAVAILABLE and a null media -- never 4xx, because the traveller still has to see the place.
        The caller is checked before any image provider is asked: this reads one journey's own places,
        so it needs traveller credentials (401 without them, `TRAVELER_CREDENTIALS_MISSING`), a seat on that
        journey held by an owner or an in-force member (403 `JOURNEY_MEMBER_REQUIRED`), and the place
        has to be one this journey actually holds -- a place row from elsewhere answers the same 404 as
        a place that does not exist, so the door cannot be walked to enumerate another traveller's trip.
        `place-identity` answers with `media_path`, which is this path with the id it resolved.
      responses:
        '200':
          description: PlaceMedia projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaceMediaResponse'}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404': {description: "Journey not found, or this place is not part of the journey (error.reason_code PLACE_NOT_IN_JOURNEY)"}
  /journeys/{journey_id}/place-identity:
    parameters:
      - name: journey_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getJourneyPlaceIdentity
      description: >
        Which place is this map point? A workspace map carries a source lead -- Photon, Nominatim or a
        discovery candidate -- and that lead is not a `Place.id`, so the mapping runs here, server-side,
        against stored identity columns only. Text and urls are refused (`LEAD_NOT_A_PLACE_LEAD`) rather
        than looked up by name, because name matching is how a same-named landmark in another city gets
        the wrong photograph; a lead two rows claim is refused as `LEAD_AMBIGUOUS` instead of guessed.
        The same door as the media read, asked before any lookup: 401 without credentials, 403 without a
        seat, 404 for a journey that is not there. It asks no image provider, so it costs no provider
        call, and `media_path` is that other door, already filled in.
      parameters:
        - name: lead
          in: query
          required: true
          description: The map point's candidate id, as it is carried -- no name, no url.
          schema: {type: string}
      responses:
        '200':
          description: Resolved identity and region for one lead this journey holds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaceLeadResponse'}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404':
          description: >
            Journey not found, or the lead answers nothing. The two absences are named apart, because the
            caller does a different thing about each: `LEAD_HAS_NO_PLACE_ROW` when no `places` row carries
            that identity anywhere in this store, `PLACE_NOT_IN_JOURNEY` when a row did match and this
            journey does not hold it. Also `LEAD_NOT_A_PLACE_LEAD` for text or a url, `LEAD_AMBIGUOUS`
            when two rows claim one provider object id, `CANDIDATE_NOT_MATERIALIZED` for a candidate row
            with no place yet.
        '409':
          description: >
            The lead's own candidate row and its place row carry different regions
            (error.reason_code LEAD_REGION_CONFLICT)
  /journeys/{journey_id}/members/me:
    parameters:
      - name: journey_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getJourneyMemberMe
      description: >
        Does the caller hold a seat on this journey, as what, and until when -- the one read a confirm
        button needs before it may be shown. The seat words are the same three the member list already
        answers with (MEMBER_IN_FORCE, MEMBER_LAPSED, MEMBER_WITHDRAWN), plus OWNER for the traveller the
        journey belongs to, who holds a seat without holding a membership row. Credentials first: 401
        `TRAVELER_CREDENTIALS_MISSING` when none was presented, 404 for a journey that is not there, 403
        `JOURNEY_MEMBER_REQUIRED` when the caller has no seat in force -- and that 403 carries the seat
        that explains itself, so a screen can say "this seat ended" rather than "you are lost".
      responses:
        '200':
          description: The caller's own seat on this journey
          content:
            application/json:
              schema:
                type: object
                required: [journey_id, traveler_id, seat, may_confirm_departure]
                properties:
                  journey_id: {type: string, format: uuid}
                  traveler_id: {type: string}
                  may_confirm_departure: {type: boolean}
                  seat:
                    type: object
                    required: [seat_kind, role, member_state, in_force]
                    properties:
                      seat_kind: {type: string, enum: [OWNER, MEMBER, NONE]}
                      role: {type: [string, "null"]}
                      member_id: {type: [string, "null"]}
                      member_state:
                        type: string
                        enum: [MEMBER_IN_FORCE, MEMBER_LAPSED, MEMBER_WITHDRAWN, NO_MEMBERSHIP]
                      expires_at: {type: [string, "null"]}
                      in_force: {type: boolean}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404': {description: Journey not found}
  /journeys/{journey_id}/departure:
    parameters:
      - name: journey_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getJourneyDeparture
      description: >
        One projection of "准备出发", read from durable rows only: which plan versions this journey holds,
        what the server froze for each, whether that freeze has passed, and the single gate word for the
        journey -- READY_TO_DEPART, ALREADY_RUNNING, NO_PLAN_SELECTED, STALE_RECOMPOSE_REQUIRED,
        PLAN_INFEASIBLE or JOURNEY_NOT_PLANNABLE. It writes nothing and asks no provider: a screen that
        looks at departure cannot start a trip, and the gate is decided in one order (an ACTIVE journey is
        reported as running before its evidence is judged). The stale-evidence words are the same words
        the write doors raise for the same row -- `select` answers 409 STALE_RECOMPOSE_REQUIRED for a
        candidate with nothing frozen, and `start` answers 409 STALE_RECOMPOSE_REQUIRED when the frozen
        evidence has expired; both are pinned by name in the backend suite, because this door mirrors
        those predicates rather than sharing them. `feasibility.failures` carries the evaluator's own
        strings whenever the gate is PLAN_INFEASIBLE, so nothing is re-worded for the screen.
      responses:
        '200':
          description: Departure projection for one journey the caller holds a seat on
          content:
            application/json:
              schema:
                type: object
                required: [journey_id, journey_status, seat, gate, candidates, next_action, observed_at]
                properties:
                  journey_id: {type: string, format: uuid}
                  journey_status: {type: string}
                  active_plan_version_id: {type: [string, "null"]}
                  current_activity_id: {type: [string, "null"]}
                  seat: {type: object}
                  gate:
                    type: string
                    enum: [READY_TO_DEPART, ALREADY_RUNNING, NO_PLAN_SELECTED, STALE_RECOMPOSE_REQUIRED,
                           PLAN_INFEASIBLE, JOURNEY_NOT_PLANNABLE]
                  reason_detail: {type: [string, "null"]}
                  selected_plan: {type: [object, "null"]}
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [plan_version_id, version_no, status, evidence, feasibility]
                      properties:
                        plan_version_id: {type: string, format: uuid}
                        version_no: {type: integer}
                        planning_mode: {type: string}
                        status: {type: string}
                        source: {type: string}
                        currency: {type: string}
                        total_cost_minor: {type: integer}
                        estimated_duration_min: {type: integer}
                        activities_count: {type: integer}
                        evidence:
                          type: object
                          required: [frozen, expired, reference_consistent]
                          properties:
                            frozen: {type: boolean}
                            snapshot_id: {type: [string, "null"]}
                            expires_at: {type: [string, "null"]}
                            expired: {type: [boolean, "null"]}
                            reference_consistent: {type: boolean}
                            detail: {type: [string, "null"]}
                        feasibility:
                          type: object
                          properties:
                            feasible: {type: [boolean, "null"]}
                            failures: {type: array, items: {type: string}}
                            detail: {type: [string, "null"]}
                  next_action:
                    type: object
                    required: [kind, door]
                    properties:
                      kind:
                        type: string
                        enum: [select_or_start, generate_plans, recompose, none]
                      door: {type: [string, "null"]}
                  observed_at: {type: string}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404': {description: Journey not found}
  /journeys/{journey_id}/departure/commit:
    parameters:
      - name: journey_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: commitJourneyDeparture
      description: >
        Turn the variant a traveller picked out of `departure.candidates` into this journey's formal
        plan, once, for the member who asked. The transition is not re-decided here: the door calls the
        same `select_plan` the app already calls in-process for the seed supply and the staged advance,
        so frozen evidence, feasibility, retiring the previous SELECTED row, the cursor and the
        single-ACTIVE invariant keep one writer, and `plan_versions.source` keeps its three closed
        words (INITIAL / REPLAN / MANUAL) -- this door invents no fourth and needs no migration.
        What `POST /plans/{plan_version_id}/select` does not answer, and this adds: who decided -- the
        caller is resolved through the shared traveller verifier and must hold a seat in force, and the
        decision is written to `audit_logs` with `actor_type` traveler and that actor id -- and whether
        this exact request was already applied. `Idempotency-Key` is required, its receipt lives in the
        existing `idempotency_keys` table, and a replay answers the stored body with
        `idempotency_replay: true` instead of committing twice or emitting a second audit event; the
        header is optional in the schema on purpose, because a caller who omits it must get the named
        refusal (IDEMPOTENCY_KEY_REQUIRED) rather than a transport-level error. The body accepts one
        field, `plan_version_id`, and refuses any other key by name, so no place text and no URL is
        ever described to the server through this door. A refusal from the transition keeps the
        transition's own sentence and adds `error.reason_code`: 409 STALE_RECOMPOSE_REQUIRED for a
        candidate with nothing frozen (pinned to `select`'s literal detail in the backend suite) and
        422 PLAN_INFEASIBLE carrying the evaluator's strings. A refused commit stores no receipt, so the
        same key still works once the underlying state is fixed.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_version_id]
              properties:
                plan_version_id: {type: string, format: uuid}
      responses:
        '200':
          description: The chosen variant is this journey's formal plan, or the stored receipt of the call that made it one
          content:
            application/json:
              schema:
                type: object
                required: [journey_id, plan_version_id, committed_by, seat, decision_action, journey]
                properties:
                  journey_id: {type: string, format: uuid}
                  plan_version_id: {type: string, format: uuid}
                  committed_by: {type: string, format: uuid}
                  seat: {type: object}
                  idempotency_key: {type: string}
                  decision_action: {type: string}
                  committed_at: {type: string}
                  idempotency_replay: {type: boolean}
                  journey: {type: object}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: "The caller holds no in-force seat, so it cannot confirm for anybody else (error.reason_code JOURNEY_MEMBER_REQUIRED)"}
        '404': {description: "Journey unknown, or that plan version is not on this journey (error.reason_code PLAN_NOT_IN_JOURNEY)"}
        '409': {description: "Same key used for a different request (IDEMPOTENCY_KEY_REUSE_CONFLICT), or the transition refused the row (STALE_RECOMPOSE_REQUIRED), or a round is still asking about that plan version (COMMIT_ROUND_IN_FLIGHT) -- asking means the consent door's own fulfilment rule has not decided it, so a round everybody required approved is answered even when the plan door refused to apply"}
        '422': {description: "Missing Idempotency-Key (IDEMPOTENCY_KEY_REQUIRED), a body field beyond plan_version_id (COMMIT_BODY_TAKES_ONLY_PLAN_VERSION_ID), or PLAN_INFEASIBLE"}
  /journeys/{journey_id}/departure/facts:
    parameters: [{$ref: '#/components/parameters/JourneyId'}]
    get:
      operationId: getJourneyDepartureFacts
      description: >
        For the slots of one plan version of one journey the caller holds a seat on, what this server
        actually holds about the place each slot names: the identity pair (our canonical id plus the
        `provider_key:external_id` it came from), whether there is a plottable point, whether the row
        states an opening window, whether it states a verified cost, and when that cost was taken.
        Nothing is looked up and nothing is written: the slots come from `Activity` rows of a
        `PlanVersion` on this journey, the judgements are the ones `app.services` already makes for the
        feasibility gate (`_place_window`, `_place_verified_cost`), and no provider client is reachable
        from this module, so a fact read cannot spend quota, cannot become a place or network
        enumeration door, and cannot answer 200 by inventing a number. An absence is named instead:
        `state` is UNKNOWN with a `detail` word (SLOT_HAS_NO_LOCATION, OPENING_HOURS_NOT_RECORDED,
        OPENING_WINDOW_NOT_AN_INTERVAL, NO_COST_EVIDENCE_OBJECT, COST_EVIDENCE_STATUS_NOT_KNOWN,
        CITY_SERVICE_CARRIES_NO_POINT, SERVICE_AVAILABILITY_NOT_RECORDED,
        SERVICE_AVAILABILITY_NOT_AN_INTERVAL), and the amount stays absent rather than zero. A slot
        naming a place row this store does not hold is not an answer given here, because
        `activities.place_id` is a foreign key `ON DELETE SET NULL`: deleting the place leaves the slot
        pointing at nothing, which is `SLOT_HAS_NO_LOCATION`. A place's verified cost and the estimate
        the plan row carries are two fields, never merged. A coordinate uses the shipped pair
        READY / UNAVAILABLE. Licence and author are one door away: a place slot carries the
        `media_door` path to read them from.
      parameters:
        - name: plan_version_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Per-slot facts for one plan version of one journey the caller holds a seat on
          content:
            application/json:
              schema:
                type: object
                required: [journey_id, plan_version_id, plan_status, seat, slots, facts_counted, observed_at]
                properties:
                  journey_id: {type: string, format: uuid}
                  plan_version_id: {type: string, format: uuid}
                  plan_status: {type: string}
                  seat: {type: object}
                  slots:
                    type: array
                    items: {$ref: '#/components/schemas/DepartureFactsSlot'}
                  facts_counted:
                    type: object
                    required: [known, unknown]
                    properties:
                      known: {type: integer}
                      unknown: {type: integer}
                  observed_at: {type: string}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404': {description: "Journey unknown, or that plan version is not on this journey (error.reason_code PLAN_NOT_IN_JOURNEY)"}
        '422': {description: plan_version_id was not supplied (error.reason_code PLAN_VERSION_ID_REQUIRED)}
  /journeys/{journey_id}/replan-proposals/{proposal_id}/consent:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: proposal_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getJourneyProposalConsent
      description: >
        Who must agree to this shared future, who has, and what the rule therefore decides. The
        required set is read through the two predicates the member doors already use -- `_member_state`
        for in-force, `journey_role_capabilities` for the role's `JOURNEY_UPDATE` -- so narrowing that
        table narrows the round the same instant; it is never a role list written into a handler. The
        roster projection in `app.main` is deliberately not called here: it refreshes a twin snapshot
        per member, and a status read that writes storage is the defect this project already names for
        `GET /experience`. Answers are the `audit_logs` rows this round writes, one per press, latest
        per traveller; `classification` is the mediation word a mission recorded for this exact
        proposal in `resolved_intent_json`, or null when none did. Nothing is asked of a provider.
      responses:
        '200':
          description: The round, its required set, its answers, and the state of the shared plan
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectiveConsentRound'}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404': {description: That proposal is not a proposal of this journey (error.reason_code PROPOSAL_NOT_IN_JOURNEY)}
    post:
      operationId: postJourneyProposalConsent
      description: >
        Record one member's APPROVE or REJECT for one proposal, as themselves. The body carries one
        decision word and nothing else: the traveller it belongs to comes from the credential, and a
        body that names a principal is refused by name (`CONSENT_DELEGATION_REFUSED`) rather than
        ignored -- an organiser cannot confirm for another member, and there is no code path here that
        would let them. `Idempotency-Key` is required, so a retry after a dropped response replays the
        answer instead of recording the same act twice.
        Two of three leaves the shared plan exactly where it was: no apply attempt, no receipt. When
        the last required member approves, this door issues a `collective_authority_receipts` row --
        its `required_member_ids_json`, `principal_actor_ids_json` and `response_audit_ids_json` are
        written for the first time here, and its `decision_epoch` is `collective_decision_epoch` from
        `app.collective_mediation` -- and then asks the door that already validates the transition,
        `POST /api/v1/replans/{proposal_id}/accept`, in-process. Its refusal is reported beside the
        fulfilled rule as `plan_apply`, never merged into it: consent being complete and the plan being
        applyable are two facts. A REJECT invalidates a receipt that a previous round issued
        (`COLLECTIVE_MEMBER_REJECTED`), and a later APPROVE mints a new one rather than reviving it.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [APPROVE, REJECT]}
      responses:
        '200':
          description: The round after this press, with plan_apply stating what the plan door said
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectiveConsentRound'}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404': {description: That proposal is not a proposal of this journey (error.reason_code PROPOSAL_NOT_IN_JOURNEY)}
        '409':
          description: >
            The proposal is not one a member may answer (PROPOSAL_NOT_ACTIONABLE), no in-force member
            holds JOURNEY_UPDATE so no round could bind one
            (NO_IN_FORCE_MEMBER_CAN_AUTHORIZE_JOURNEY_UPDATE), or the key was reused for a different
            consent (CONSENT_IDEMPOTENCY_KEY_REUSE_CONFLICT)
        '422':
          description: >
            A missing key (CONSENT_IDEMPOTENCY_KEY_REQUIRED), an unknown decision word
            (CONSENT_DECISION_WORD_UNKNOWN), a body field that is not `decision`
            (CONSENT_BODY_TAKES_ONLY_DECISION), or a body that names another traveller
            (CONSENT_DELEGATION_REFUSED)
  /journeys/{journey_id}/plans/from-slots:
    parameters: [{$ref: '#/components/parameters/JourneyId'}]
    post:
      operationId: postJourneyPlanFromSlots
      description: >
        Write the slots a draft already holds as a new CANDIDATE plan version, keeping their order and
        their times. The shipped generator re-schedules, so it cannot be the door that turns a chosen
        draft into a plan without claiming a preservation that did not happen. A slot names a canonical
        `places` row and carries its own times; a provider id (`provider_key:external_id`) is refused
        by name and pointed at the identity read that yields the canonical id, and the fields that would
        describe a place (`title`, `name`, `url`, `query`, `address`, `external_id`, `source_id`,
        `photo`, `image`, `tags`) are refused rather than stored, because `activities.title` is written
        from the Place row this door reads. A place whose `city_code` differs from the journey's is a
        refusal, not a plan. `expected_revision` has to be *said* by every call: it is the journey's
        current `active_plan_version_id`, or `null` for a journey that has no plan version yet -- which
        is how a first draft gets written, since there is nothing for it to have moved off. Naming
        `null` while a plan is in force is `BASE_PLAN_MOVED`, not an acceptance, and leaving the field
        out is `EXPECTED_REVISION_REQUIRED`; `Idempotency-Key` is required so a retry replays the same plan version
        instead of writing a second one. Nothing is selected, started or activated here -- the row is
        CANDIDATE until `POST /api/v1/journeys/{journey_id}/departure/commit` -- and no provider is
        reachable from the module, so this cannot spend quota. An undeclared cost stays undeclared:
        the column's zero is stored because the DDL demands NOT NULL, and `cost_declared` says false.
        Its own frozen evidence is not this door's to invent: a candidate written here reaches a
        judgeable submission through `POST /api/v1/journeys/{journey_id}/plans/{plan_version_id}/mobility-freeze`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slots, expected_revision]
              properties:
                expected_revision:
                  type: [string, "null"]
                  format: uuid
                  description: >
                    The plan version this draft was read against. `null` is a statement, not an omission:
                    it says the journey has no plan version yet, and is what a first draft of a journey
                    sends. Omitting the field stays `EXPECTED_REVISION_REQUIRED`.
                planning_mode:
                  type: string
                  enum: [balanced, budget, explore, strict_schedule]
                slots:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [place_id, start_at, end_at]
                    properties:
                      place_id: {type: string, format: uuid}
                      start_at: {type: string, format: date-time}
                      end_at: {type: string, format: date-time}
                      estimated_cost_minor: {type: integer}
                      currency: {type: string}
                      travel_from_prev_min: {type: integer, minimum: 0}
      responses:
        '201':
          description: The CANDIDATE version that was written, with per-slot gaps and next actions
          content:
            application/json:
              schema:
                type: object
                required: [journey_id, plan_version_id, draft_revision, status, version_no, slots,
                           counts, gaps, next_actions, selected, activated]
                properties:
                  journey_id: {type: string, format: uuid}
                  plan_version_id: {type: string, format: uuid}
                  draft_revision:
                    type: [string, "null"]
                    format: uuid
                    description: Echoed back as the caller named it -- the plan version, or null when this draft is the journey's first.
                  status: {type: string, const: CANDIDATE}
                  version_no: {type: integer}
                  planning_mode: {type: string}
                  created_by_traveler_id: {type: string, format: uuid}
                  selected: {type: boolean}
                  activated: {type: boolean}
                  idempotency_replay: {type: boolean}
                  created_at: {type: string}
                  slots:
                    type: array
                    items:
                      type: object
                      required: [sequence_no, place_id, start_at, end_at, estimated_cost_minor,
                                 cost_declared, currency, facts]
                      properties:
                        sequence_no: {type: integer}
                        place_id: {type: string, format: uuid}
                        start_at: {type: string, format: date-time}
                        end_at: {type: string, format: date-time}
                        estimated_cost_minor: {type: integer}
                        cost_declared: {type: boolean}
                        currency: {type: string}
                        facts:
                          type: object
                          required: [place_id, title, city_code, has_coordinate,
                                     opening_hours_recorded, verified_cost_minor, cost_declared,
                                     gaps]
                          properties:
                            place_id: {type: string, format: uuid}
                            title: {type: string}
                            city_code: {type: string}
                            has_coordinate: {type: boolean}
                            opening_hours_recorded: {type: boolean}
                            verified_cost_minor: {type: [integer, "null"]}
                            cost_declared: {type: boolean}
                            gaps:
                              type: array
                              items:
                                type: string
                                enum: [OPENING_HOURS_NOT_RECORDED, NO_COST_DECLARED_FOR_THIS_SLOT,
                                       PLACE_HAS_NO_POINT]
                  counts:
                    type: object
                    required: [slots, with_coordinate, hours_recorded, cost_verified, cost_declared]
                    properties:
                      slots: {type: integer}
                      with_coordinate: {type: integer}
                      hours_recorded: {type: integer}
                      cost_verified: {type: integer}
                      cost_declared: {type: integer}
                  gaps:
                    type: array
                    items:
                      type: object
                      required: [sequence_no, place_id, gaps]
                      properties:
                        sequence_no: {type: integer}
                        place_id: {type: string, format: uuid}
                        gaps: {type: array, items: {type: string}}
                  next_actions: {type: array, items: {type: string}}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404': {description: A slot names a place id this store does not have (error.reason_code PLACE_ROW_NOT_FOUND)}
        '409':
          description: >
            The draft was read against a plan that is no longer in force (BASE_PLAN_MOVED), a slot's
            place belongs to another city (PLACE_NOT_IN_THIS_JOURNEYS_CITY), or the key was reused for
            a different request (IDEMPOTENCY_KEY_REUSE_CONFLICT)
        '422':
          description: >
            A key the caller never sent (IDEMPOTENCY_KEY_REQUIRED), a revision the body never named
            (EXPECTED_REVISION_REQUIRED),
            a provider id where a canonical id belongs (SLOT_NAMES_A_PROVIDER_ID_NOT_A_CANONICAL_PLACE),
            a slot that describes a place (SLOT_CARRIES_ONLY_SERVER_OWNED_FIELDS), a body field this
            door does not take (FROM_SLOTS_BODY_TAKES_ONLY_THE_SERVERS_OWN_FIELDS), no slots
            (FROM_SLOTS_NEEDS_AT_LEAST_ONE_SLOT), an unreadable timestamp (SLOT_TIMESTAMP_NOT_PARSEABLE)
            or an end not after a start (SLOT_TIMES_UNORDERED)
  /journeys/{journey_id}/plans/{plan_version_id}/submission:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: plan_version_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: postJourneyPlanSubmission
      description: >
        Present a CANDIDATE plan version of this journey to its members as a `replan_proposals` row in the
        shipped PRESENTED state, without applying it to anybody: the journey keeps pointing at its active
        version, the candidate keeps its own status, and the round that follows is the consent door. The
        body is empty on purpose -- every field stored is read from rows and judged by the functions that
        already own those judgements: `hard_constraints_passed` from `app.services.validate_plan_feasibility`
        (the same gate `select` runs; it raises `STALE_RECOMPOSE_REQUIRED` for a version whose frozen
        mobility evidence is missing, which is stored as not-passed with `gate.judged` false and the gate's
        own code, never as a pass), `locked_commitments_preserved` from the base's own `locked` slots and
        the places the candidate carries (and `lock_flags_dropped` / `lock_flags_added`, which name the
        `locked` word itself on slots both sides carry -- that claim compares places, and a candidate
        written by `from-slots` always says unlocked), `utility_score` and `score_breakdown` from
        `app.replanning.verified_scoring.score_replan_candidate` fed with the difference below and an
        envelope built from the rows, and `diff_json` from `app.plan_delta.delta_of` -- the same arithmetic
        `GET .../plans/delta` answers with, so the Guardian's bound checks and this door cannot disagree.
        `trigger_event_id` and `recovery_epoch_id` stay null: a hand-built candidate was triggered by
        nothing, and this door does not manufacture an event or an epoch to fill a column. A mixed currency
        is refused rather than stored as a subtracted pair, a pair already presented is refused by name, a
        candidate that differs from the plan in force in no place, time, money or commitment is refused as
        `SUBMISSION_NO_MATERIAL_CHANGE` rather than turned into a vote about nothing -- a difference
        confined to `activities.status`, the lifecycle word this server writes as the day runs, is named
        in that refusal and not counted as something to approve. `Idempotency-Key`
        is required so a retry replays one proposal instead of writing a second round. No provider is
        reachable from this module.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Empty. A caller that supplies a field is refused by name because a submitted
                judgement would be a second answer about the same rows.
      responses:
        '201':
          description: The PRESENTED proposal, the difference it carries, and where the round goes next
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanCandidateSubmission'}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404': {description: That version is not a plan of this journey (error.reason_code PLAN_NOT_IN_JOURNEY)}
        '409': {description: "Not a CANDIDATE row, no active base, this pair already presented, or a reused key (error.reason_code SUBMISSION_NEEDS_A_CANDIDATE_VERSION, SUBMISSION_JOURNEY_HAS_NO_ACTIVE_PLAN, SUBMISSION_ALREADY_PRESENTED, SUBMISSION_IDEMPOTENCY_KEY_REUSE_CONFLICT)"}
        '422': {description: "A body field, no key, the active version itself, two currencies, or a candidate that changes nothing against the plan in force (error.reason_code SUBMISSION_READS_EVERYTHING_FROM_ROWS, SUBMISSION_IDEMPOTENCY_KEY_REQUIRED, SUBMISSION_BASE_IS_THE_CANDIDATE, SUBMISSION_NEEDS_ONE_CURRENCY, SUBMISSION_NO_MATERIAL_CHANGE)"}

  /journeys/{journey_id}/plans/{plan_version_id}/mobility-freeze:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: plan_version_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: postJourneyPlanMobilityFreeze
      description: >
        Freeze the travel facts one CANDIDATE plan version's own slots imply, onto the two nullable
        columns `plan_versions` already carries. This is the door that makes a hand-built candidate
        judgeable: `app.services.validate_plan_feasibility` raises `STALE_RECOMPOSE_REQUIRED` for a
        version with no frozen evidence, so the submission door can only answer `gate.judged` false with
        `evidence_gap` true until this door has run. Nothing is invented: the legs are the plan's own
        `activities` rows in `sequence_no` order, every leg is measured by
        `app.integrations.mobility.runtime.capture_runtime_mobility_snapshot` -- the same primitive
        `plans/generate` uses, so this door adds no provider, no fallback rule and no trust level -- and
        what is stored is that capture's own snapshot id plus its own evidence document. A caller cannot
        supply minutes, a place list or a judgement: a body with any field is refused, so this cannot
        become a route-quoting or place-enumeration surface.
        Unlike the other plan doors, this one can reach a provider: when the deployment configures one,
        that capture is a live call per leg, and `counts.legs_requested` says how many. The answer counts
        `hard_eligible_legs` separately from `legs_frozen` and lists every leg's own `fact_qualities`
        word, because the fixture's blanket constant is not a measurement and must not read as one.
        Re-freezing a candidate is allowed while nobody is answering about it, and the answer names the
        snapshot id it replaces. The idempotency receipt is consulted before any state guard, so a retry
        of a press that already froze evidence replays that receipt instead of being refused by the very
        write it made. Nothing is selected, started, activated or presented here.
        A plan that visits one place in two consecutive slots is named in full (`same_place_consecutive_transitions`): the capture domain deliberately freezes no fact for a
        pair whose origin equals its destination, so the shipped gate will answer
        MOBILITY_DATA_UNAVAILABLE for it. This door reports that step instead of inventing a
        zero-minute measurement to hide it.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Empty. Every leg is read from rows, so a caller has nothing to give this door.
      responses:
        '200':
          description: The frozen evidence this server wrote, with each leg's own provenance counts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanCandidateMobilityFreeze'}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404': {description: That version is not a plan of this journey (error.reason_code PLAN_NOT_IN_JOURNEY)}
        '409': {description: "Not a CANDIDATE row, one of the two evidence columns present alone, a round already asking about this candidate, a slot whose place carries no point, or a reused key (error.reason_code FREEZE_NEEDS_A_CANDIDATE_VERSION, FREEZE_EVIDENCE_COLUMN_PAIR_IS_SPLIT, FREEZE_PROPOSAL_ALREADY_ASKING, FREEZE_SLOT_PLACE_HAS_NO_POINT, FREEZE_IDEMPOTENCY_KEY_REUSE_CONFLICT)"}
        '422': {description: "A body field, or no Idempotency-Key (error.reason_code FREEZE_READS_EVERY_LEG_FROM_ROWS, FREEZE_IDEMPOTENCY_KEY_REQUIRED)"}
        '503': {description: "The mobility source refused a leg, so no evidence was written (error.reason_code MOBILITY_PROVIDER_REFUSED_A_LEG)"}

  /journeys/{journey_id}/plans/delta:
    parameters: [{$ref: '#/components/parameters/JourneyId'}]
    get:
      operationId: getJourneyPlanDelta
      description: >
        What one plan version changes against another on this journey: the places a map must add and
        drop, the money and minutes the rows carry, and the mobility evidence both versions froze. The
        two version ids are the only inputs, and each must be a row on this journey, so a delta cannot
        enumerate another traveller's plan or reach a provider. Every per-slot judgement -- identity,
        coordinate state, opening window, verified cost, media door -- is `app.departure_facts._slot`,
        the same function `GET .../departure/facts` answers with, and a test runs both doors over the
        same rows and compares them field by field. Points are ordered by `sequence_no` on both sides.
        An unpriced slot is counted in `verified_cost.unpriced_slots`, never priced; two versions in
        different currencies produce no `budget_delta.delta_minor` rather than a subtracted pair; a slot
        whose free-text times this server cannot parse is named in `duration_delta.*_unreadable_slots`
        instead of quietly shortening the day. Matching kept/moved/added/removed is `sequence_no` plus
        place identity, and a slot whose place appeared on neither side is reported as
        `KEPT_WITHOUT_PLACE`, not as a move. Nothing is written and nothing is selected.
      parameters:
        - name: from_plan_version_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: to_plan_version_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The map, budget, duration and evidence difference between the two versions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanDeltaAnswer'}
        '401': {description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)}
        '403': {description: The caller holds no in-force seat on this journey (error.reason_code JOURNEY_MEMBER_REQUIRED)}
        '404': {description: Either version is not a plan of this journey (error.reason_code PLAN_NOT_IN_JOURNEY)}
        '422': {description: "A version id is missing, or both ids name the same version (error.reason_code FROM_PLAN_VERSION_ID_REQUIRED, TO_PLAN_VERSION_ID_REQUIRED, DELTA_NEEDS_TWO_DIFFERENT_VERSIONS)"}

