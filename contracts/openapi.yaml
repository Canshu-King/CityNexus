      required: [id, name, category, location, city_code, external_id, provider_key, coordinate_system, source_coordinate_system, opening_hours, cost_evidence]
      properties:
        id: {type: string}
        name: {type: string}
        category: {type: string}
        city_code: {type: string}
        location: {$ref: '#/components/schemas/GeoPoint'}
        tags: {type: array, items: {type: string}}
