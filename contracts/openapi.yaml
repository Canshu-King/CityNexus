          application/json:
            schema: {$ref: '#/components/schemas/ConstraintInput'}
      responses:
        '201':
          description: Constraint created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Constraint'}
  /journeys/{journey_id}/constraints/{constraint_id}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: constraint_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: deleteConstraint
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
  /places:
    get:
