    post:
      operationId: confirmJourneyCapabilities
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: array, items: {type: object}}
      responses:
        '200':
          description: >-
            Confirmed journey capability facts.  When a newly confirmed HARD
            capability invalidates the ACTIVE plan, `recovery` carries the
            durable governed recovery state; the active plan is never silently
            rewritten.
          content:
            application/json:
              schema:
                type: object
                properties:
                  journey_id: {type: string, format: uuid}
                  capabilities: {type: array, items: {type: object}}
                  summary: {type: object}
                  traveler_twin: {type: object}
                  active_plan_feasibility:
                    type: object
                    nullable: true
                    properties:
                      passed: {type: boolean, nullable: true}
                      failures: {type: array, items: {type: string}}
                      state:
                        type: string
                        enum: [PLAN_FEASIBLE, REPLAN_REQUIRED, NO_ACTIVE_PLAN]
                  recovery: {$ref: '#/components/schemas/RecoveryState'}
  /journeys/{journey_id}/recovery/acknowledge:
    parameters: [{$ref: '#/components/parameters/JourneyId'}]
    post:
      operationId: acknowledgeJourneyRecovery
      responses:
        '200':
          description: >-
            Governed acknowledgement of an open recovery warning.  Records that
            the traveller saw the warning; it never resolves the recovery, never
            marks an infeasible plan safe, and never lets stale evidence look
            current.  `experience_flags.needs_review` stays true until a
            revalidated feasible plan is actually selected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  journey_id: {type: string, format: uuid}
                  acknowledged: {type: boolean}
                  resolved: {type: boolean, enum: [false]}
                  recovery: {$ref: '#/components/schemas/RecoveryState'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/stays/offers/capture:
