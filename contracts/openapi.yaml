  # ORD-0057 (arbitration `5749459724` section 1): an accepted generation is an operation,
  # not a held-open request.  These four are published here because the parity gate
  # (test_openapi_runtime_method_parity_includes_v7_surface) asserts contract and runtime are
  # the same set - an implemented-but-unpublished surface is exactly the drift it catches.
  # ORD-0058: the scene read a Simulation client needs so it never invents its own clock.
  # ORD-0078 revision: reset seeds only; preparing and starting are their own actions, so the
  # fixture door cannot leak a SELECTED plan into GET /plans for everyone else.
  /demo/prepare-scenario:
    post:
      operationId: prepareDemoScenario
      responses:
        '200': {description: 'Journey pushed to PLANNED with a SELECTED plan via the real pipeline; no /start', content: {application/json: {schema: {type: object}}}}
        '403': {description: 'CITYNEXUS_DEMO_MODE is not set; nothing was generated or selected', content: {application/json: {schema: {type: object}}}}
  # ORD-0078: the second stage of the demo, behind the same switch as reset.
  /demo/start-scenario:
    post:
      operationId: startDemoScenario
      responses:
        '200': {description: 'Scenario started through /start, with the journey status and cursor it produced', content: {application/json: {schema: {type: object}}}}
        '403': {description: 'CITYNEXUS_DEMO_MODE is not set; nothing was started', content: {application/json: {schema: {type: object}}}}
  /demo/scene:
    get:
      operationId: readDemoScene
      responses:
        '200': {description: 'demo_mode, the seeded journey window, its cursor-derived effective_now, and the evidence that window is priced with: evidence_state (REFERENCED | FROZEN_WITHOUT_TTL | EVIDENCE_REFERENCE_INCONSISTENT | NO_FROZEN_EVIDENCE | NO_SCENARIO), evidence_snapshot_id, evidence_reference_consistent, and mobility_legs_total versus mobility_legs_hard_eligible. The leg counts report how much of the plan the sealed facts already cover and license nothing - /replans decides for itself', content: {application/json: {schema: {type: object}}}}
  /destinations/capability:
    get:
      operationId: getDestinationCapability
      parameters:
        - name: query
          in: query
          required: true
          description: What the traveller typed (a name, not an internal city code).
          schema: {type: string, minLength: 1, maxLength: 120}
      responses:
        '200': {description: 'capability (READY | HYDRATABLE | UNKNOWN_RETRYABLE | UNAVAILABLE - four structural cells since the arbiter answer "one" on 2026-09-22; still no UNKNOWN, because "nobody looked" remains an absent provider_status and never a state, and UNKNOWN_RETRYABLE is reserved for the opposite case: we asked and nothing could answer, which is always paired with retryable true and the action RETRY_LATER rather than an invitation to prepare) + destination_state (RESOLVED | AMBIGUOUS | NO_MATCH | RUNTIME_FAILURE - what the resolver concluded about this request, a separate axis from capability) + reason_code + recommended_action + retryable + coverage for all six intents (attractions, food, nightlife, lodging, mobility, booking) each READY | PARTIAL | MISSING + coverage_detail with the counts behind each state + canonical_destination_id, which is NULL for AMBIGUOUS / NO_MATCH / RUNTIME_FAILURE and never contains user text (ORD-0167: raw text is not identity) + pending_destination_label (the traveller input verbatim) + resolver_query_normalized (the folded form matching used, also not an identity) + destination_pending_key (correlation material only, never a place or destination identifier and never a catalog join key) + candidates (populated only when the query is ambiguous, so no winner is guessed) + malformed_candidates (evidence a provider offered and this build refused: an entity reference that names no OSM element class, or a position outside the WGS-84 range; a refusal is a named RUNTIME_FAILURE with attribution_reason=PROVIDER_BAD_RESPONSE and retryable=true, never an identity, never NO_MATCH, and the refused record is kept verbatim instead of being rounded or repaired) + the attribution group attribution_reason / evidence_kind / http_status / source_layer, derived once from the same observation and arriving together or not at all, with http_status null rather than 0 when nothing answered (R14 section 8: four consumers, one classification) + hard_gaps, always present and empty when there is nothing to name, carrying MOBILITY_EVIDENCE_NOT_HARD_ELIGIBLE when the destination is named, the catalog holds rows, mobility has explicit legs, and none of that material is of a class anything may treat as a hard constraint - the mobility axis also reports source_classes and hard_eligible so the claim can be checked rather than inferred, and an empty axis is MISSING with no gap rather than a gap over nothing + provider_status whose destination cell carries the per-attempt evidence (endpoint / answered / http_status / elapsed_ms) on a successful answer as well as on a failed one, because evidence that only appears when something goes wrong is not evidence) + the fingerprint and its segments, four of them when a destination is named (canonical_destination_id + catalog_schema_version + readiness_policy_version + provider_policy_version) and a namespaced request fingerprint when it is not (pending-request-v1 + scope + resolver_query_normalized + the same three versions) + provenance (source_kinds, never upgraded by normalisation). READY is only ever the versioned server-side policy result: a place count cannot produce it, and a resolver that could not be reached keeps a destination retryable instead of declaring it structurally unusable', content: {application/json: {schema: {type: object}}}}
        '422': {description: Request validation failed, content: {application/json: {schema: {'$ref': '#/components/schemas/ErrorEnvelope'}}}}
  /catalog-hydrations:
    post:
      operationId: createOrReuseCatalogHydration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string, minLength: 1, maxLength: 120}
                journey_id: {type: string, format: uuid, nullable: true}
                requested_categories:
                  type: array
                  nullable: true
                  maxItems: 6
                  items: {type: string}
      responses:
        '202': {description: 'Accepted and started: operation_id, fingerprint, reused=false, status QUEUED, phase, elapsed_ms, retry_after_ms, status_url, abandon_url, and the four fingerprint segments. No provider is contacted before this answer is written', content: {application/json: {schema: {type: object}}}}
        '200': {description: 'The same answer with reused=true: an open job for this identical fingerprint already exists and this caller joined it. There is deliberately no 409 - colliding with the work is success, and pushing the caller away would make them start a second chain', content: {application/json: {schema: {type: object}}}}
        '422': {description: 'Unprocessable: an empty or over-long query, or a journey_id this backend does not have', content: {application/json: {schema: {'$ref': '#/components/schemas/ErrorEnvelope'}}}}
        '503': {description: 'The catalog store could not record the job inside the acceptance budget (named, retryable, with retry_after_ms) - never a silent 500', content: {application/json: {schema: {'$ref': '#/components/schemas/ErrorEnvelope'}}}}
  /catalog-hydrations/{operation_id}:
    get:
      operationId: getCatalogHydration
      parameters:
        - name: operation_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: 'The job read from the store: operation_id, fingerprint, reused, status (QUEUED | RUNNING | COMPLETED | FAILED | UNAVAILABLE | ABANDON_REQUESTED | ABANDONED - a lifecycle axis, separate from phase, because one axis cannot tell "abandoned but still running" from "finished"), phase (the stage the worker is genuinely inside), outcome, terminal, elapsed_ms, retry_after_ms, result or error, the four fingerprint segments, status_url, abandon_url. Deliberately no progress percentage - an invented denominator is not information', content: {application/json: {schema: {type: object}}}}
        '404': {description: 'No such operation (app envelope, not a route-level 404)', content: {application/json: {schema: {'$ref': '#/components/schemas/ErrorEnvelope'}}}}
  /catalog-hydrations/{operation_id}/abandon:
    post:
      operationId: abandonCatalogHydration
      parameters:
        - name: operation_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: 'Idempotent stop request: ABANDON_REQUESTED while in flight (never a claim that work already on the wire is dead), the real terminal state otherwise. An abandoned job writes no result', content: {application/json: {schema: {type: object}}}}
        '404': {description: 'No such operation', content: {application/json: {schema: {'$ref': '#/components/schemas/ErrorEnvelope'}}}}
  /journeys/{journey_id}/stay-generations:
    post:
      operationId: submitStayGeneration
      responses:
        '202': {description: 'Operation accepted: operation_id, status, status_url, abandon_url, retry_after_ms, reused', content: {application/json: {schema: {type: object}}}}
    get:
      operationId: listStayGenerations
      responses:
        '200': {description: 'The job this journey already has open, plus its latest operation, so a reload restores it without an id', content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/stay-generations/{operation_id}:
    get:
      operationId: readStayGeneration
      responses:
        '200': {description: 'Status, phase, outcome, elapsed_ms, retry_after_ms, stored result or error', content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/stay-generations/{operation_id}/abandon:
    post:
      operationId: abandonStayGeneration
      responses:
        '200': {description: 'Idempotent stop request: ABANDON_REQUESTED while in flight, the real terminal state otherwise', content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/stay-options:
    get:
      operationId: listStayJourneyOptions
      responses:
        '200': {description: Ranked stay and Journey options, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/stay-options/{option_id}/select:
    post:
      operationId: selectStayJourneyOption
      responses:
        '200': {description: Selected stay option, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/stay-options/{option_id}/weather:
    post:
      operationId: applyStayWeather
      responses:
        '200': {description: Weather-adjusted stay Journey option, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/stay-options/{option_id}/autopilot/recover:
    post:
      operationId: recoverStayJourneyAutopilot
      responses:
        '200': {description: Policy-gated autonomous recovery, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/stay-options/{option_id}/mode:
    post:
      operationId: changeStayOptionMode
      responses:
        '200': {description: Mode-aware Journey impact, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/multiday:
    get:
      operationId: getMultidayJourney
      responses:
        '200': {description: Multi-day anchors and day groups, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/stay-mobility/providers:
    get:
      operationId: getStayMobilityProviders
      responses:
        '200': {description: Stay and mobility provider mesh status, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/mobility:
    get:
      operationId: listJourneyMobility
      responses:
        '200': {description: Frozen multimodal facts, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/mobility/compare:
    post:
      operationId: compareJourneyMobility
      responses:
        '200': {description: Mode comparison, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/operations/luggage:
    put:
      operationId: setJourneyLuggageContext
      responses:
        '200': {description: Persisted luggage and baggage constraints, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/inbox/import:
    post:
      operationId: importJourneyReservation
      responses:
        '201': {description: Reservation draft extracted without inventing critical facts, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/inbox:
    get:
      operationId: listJourneyInbox
      responses:
        '200': {description: Journey Inbox drafts, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/memory:
    get:
      operationId: getJourneyMemory
      responses:
        '200': {description: Semantic Journey Memory timeline, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/inbox/text-extract:
    post:
      operationId: extractJourneyReservationText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string, minLength: 1, maxLength: 20000}
      responses:
        '201': {description: DeepSeek Responses text extraction draft, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/inbox/vision:
    post:
      operationId: extractJourneyReservationImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_url]
              properties:
                image_url: {type: string, minLength: 8, maxLength: 12000000}
                hint: {type: string, maxLength: 200, default: booking confirmation}
      responses:
        '201': {description: DeepSeek Responses vision extraction draft, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/web-research:
    post:
      operationId: runJourneyWebResearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: {type: string, minLength: 3, maxLength: 500}
                source_class: {type: string, enum: [OFFICIAL_NOTICE, OPERATOR_NOTICE, OPEN_WEB], default: OPEN_WEB}
      responses:
        '200': {description: Non-authoritative DeepSeek web observations, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/web-observations:
    get:
      operationId: listJourneyWebObservations
      responses:
        '200': {description: Stored non-authoritative web observations, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/execution-clock:
    get:
      operationId: getJourneyExecutionClock
      responses:
        '200': {description: Server execution clock for the Journey timezone, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/inbox/{draft_id}/confirm:
    post:
      operationId: confirmJourneyReservation
      responses:
        '200': {description: User-confirmed reservation and durable Commitment, content: {application/json: {schema: {type: object}}}}
        '409': {description: Critical reservation facts remain unresolved}
  /journeys/{journey_id}/inbox/{draft_id}:
    patch:
      operationId: patchJourneyReservationDraft
      responses:
        '200': {description: Corrected semantic reservation draft, content: {application/json: {schema: {type: object}}}}
        '409': {description: Confirmed drafts cannot be edited}
  /journeys/{journey_id}/inbox/{draft_id}/smart-apply:
    post:
      operationId: smartApplyJourneyReservation
      responses:
        '200': {description: Policy-gated semantic intake decision, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/wallet:
    get:
      operationId: getTravelWallet
      responses:
        '200': {description: Confirmed reservations and protected commitments, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/reservations/{reservation_id}/schedule-change:
    post:
      operationId: applyReservationScheduleChange
      responses:
        '200': {description: Schedule update recorded and Guardian notified, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/offline-snapshot:
    get:
      operationId: getOfflineJourneySnapshot
      responses:
        '200': {description: Read-only next-24-hour Journey snapshot and provider freshness, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/location:
    post:
      operationId: recordForegroundLocation
      responses:
        '201': {description: Foreground location observation with accuracy and timestamp, content: {application/json: {schema: {type: object}}}}
  /travelers/{traveler_id}/push-subscriptions:
    post:
      operationId: createPushSubscription
      responses:
        '201': {description: Server-owned push subscription seam, content: {application/json: {schema: {type: object}}}}
  /travelers/{traveler_id}/push-config:
    get:
      operationId: getPushConfig
      responses:
        '200': {description: Non-secret Web Push capability and public VAPID key, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/notifications:
    get:
      operationId: listJourneyNotifications
      responses:
        '200': {description: Deduplicated server-owned notification records, content: {application/json: {schema: {type: object}}}}
  /providers/v9:
    get:
      operationId: getRealTripProviderStatus
      responses:
        '200': {description: Region-aware provider readiness and honest absence semantics, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/edge/devices:
    post:
      operationId: registerEdgeCompanion
      responses:
        '201': {description: Scoped Edge Companion credential returned once, content: {application/json: {schema: {type: object}}}}
  /edge/devices/{device_id}/journey-snapshot:
    get:
      operationId: getEdgeJourneySnapshot
      responses:
        '200': {description: Compact read-only current and next Journey state, content: {application/json: {schema: {type: object}}}}
  /edge/devices/{device_id}/actions:
    post:
      operationId: createEdgeAction
      responses:
        '201': {description: Allowlisted low-risk Edge Companion action, content: {application/json: {schema: {type: object}}}}
        '403': {description: Action exceeds the Edge Companion authority surface}
  /edge/devices/{device_id}/observations:
    post:
      operationId: createEdgeObservation
      responses:
        '201': {description: Edge observation recorded as evidence, content: {application/json: {schema: {type: object}}}}
  /journeys/{journey_id}/agent/goal-tasks/{task_id}/place-media:
    get:
      operationId: getSignedGoalPlaceMedia
      summary: Read licensed media for this signed owner's existing task source lead
      parameters:
        - {name: journey_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: task_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: candidate_id, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        '200':
          description: Source-bound image or an ordinary no-image fallback; never blocks itinerary editing
          headers:
            Cache-Control: {schema: {type: string}, description: private no-store}
          content:
            application/json:
              schema:
                type: object
                required: [candidate_id, place_id, journey_id, task_id, status, media]
                properties:
                  candidate_id: {type: string}
                  place_id: {type: string}
                  journey_id: {type: string, format: uuid}
                  task_id: {type: string, format: uuid}
                  status: {type: string, enum: [REAL_POI_PHOTO, NO_IMAGE, NO_PERMISSION, UNAVAILABLE]}
                  cache_hit: {type: boolean}
                  identity_status: {type: string}
                  source_reference: {type: [string, 'null'], format: uri}
                  source_wikidata_id: {type: [string, 'null']}
                  media:
                    type: [object, 'null']
                    properties:
                      place_id: {type: string}
                      image_url: {type: string, format: uri}
                      thumb_url: {type: [string, 'null'], format: uri}
                      source_url: {type: string, format: uri}
                      author: {type: string}
                      license: {type: string}
                      terms_url: {type: [string, 'null'], format: uri}
                      can_show: {type: boolean}
                      captured_at: {type: string, format: date-time}
        '401': {description: Signed traveler required}
        '403': {description: Journey member or owner scope denied}
        '404': {description: Task or candidate does not belong to this Journey and owner}
  /journeys/{journey_id}/members/me:
    parameters:
    - name: journey_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getJourneyMemberMe
      description: 'Does the caller hold a seat on this journey, as what, and until
        when -- the one read a confirm button needs before it may be shown. The seat
        words are the same three the member list already answers with (MEMBER_IN_FORCE,
        MEMBER_LAPSED, MEMBER_WITHDRAWN), plus OWNER for the traveller the journey belongs
        to, who holds a seat without holding a membership row. Credentials first: 401
        `TRAVELER_CREDENTIALS_MISSING` when none was presented, 404 for a journey that
        is not there, 403 `JOURNEY_MEMBER_REQUIRED` when the caller has no seat in force
        -- and that 403 carries the seat that explains itself, so a screen can say "this
        seat ended" rather than "you are lost".

        '
      responses:
        '200':
          description: The caller's own seat on this journey
          content:
            application/json:
              schema:
                type: object
                required:
                - journey_id
                - traveler_id
                - seat
                - may_confirm_departure
                properties:
                  journey_id:
                    type: string
                    format: uuid
                  traveler_id:
                    type: string
                  may_confirm_departure:
                    type: boolean
                  seat:
                    type: object
                    required:
                    - seat_kind
                    - role
                    - member_state
                    - in_force
                    properties:
                      seat_kind:
                        type: string
                        enum:
                        - OWNER
                        - MEMBER
                        - NONE
                      role:
                        type:
                        - string
                        - 'null'
                      member_id:
                        type:
                        - string
                        - 'null'
                      member_state:
                        type: string
                        enum:
                        - MEMBER_IN_FORCE
                        - MEMBER_LAPSED
                        - MEMBER_WITHDRAWN
                        - NO_MEMBERSHIP
                      expires_at:
                        type:
                        - string
                        - 'null'
                      in_force:
                        type: boolean
        '401':
          description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)
        '403':
          description: The caller holds no in-force seat on this journey (error.reason_code
            JOURNEY_MEMBER_REQUIRED)
        '404':
          description: Journey not found
  /journeys/{journey_id}/departure:
    parameters:
    - name: journey_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getJourneyDeparture
      description: 'One projection of "准备出发", read from durable rows only: which plan
        versions this journey holds, what the server froze for each, whether that freeze
        has passed, and the single gate word for the journey -- READY_TO_DEPART, ALREADY_RUNNING,
        NO_PLAN_SELECTED, STALE_RECOMPOSE_REQUIRED, PLAN_INFEASIBLE or JOURNEY_NOT_PLANNABLE.
        It writes nothing and asks no provider: a screen that looks at departure cannot
        start a trip, and the gate is decided in one order (an ACTIVE journey is reported
        as running before its evidence is judged). The stale-evidence words are the
        same words the write doors raise for the same row -- `select` answers 409 STALE_RECOMPOSE_REQUIRED
        for a candidate with nothing frozen, and `start` answers 409 STALE_RECOMPOSE_REQUIRED
        when the frozen evidence has expired; both are pinned by name in the backend
        suite, because this door mirrors those predicates rather than sharing them.
        `feasibility.failures` carries the evaluator''s own strings whenever the gate
        is PLAN_INFEASIBLE, so nothing is re-worded for the screen.

        '
      responses:
        '200':
          description: Departure projection for one journey the caller holds a seat
            on
          content:
            application/json:
              schema:
                type: object
                required:
                - journey_id
                - journey_status
                - seat
                - gate
                - candidates
                - next_action
                - observed_at
                properties:
                  journey_id:
                    type: string
                    format: uuid
                  journey_status:
                    type: string
                  active_plan_version_id:
                    type:
                    - string
                    - 'null'
                  current_activity_id:
                    type:
                    - string
                    - 'null'
                  seat:
                    type: object
                  gate:
                    type: string
                    enum:
                    - READY_TO_DEPART
                    - ALREADY_RUNNING
                    - NO_PLAN_SELECTED
                    - STALE_RECOMPOSE_REQUIRED
                    - PLAN_INFEASIBLE
                    - JOURNEY_NOT_PLANNABLE
                  reason_detail:
                    type:
                    - string
                    - 'null'
                  selected_plan:
                    type:
                    - object
                    - 'null'
                  candidates:
                    type: array
                    items:
                      type: object
                      required:
                      - plan_version_id
                      - version_no
                      - status
                      - evidence
                      - feasibility
                      properties:
                        plan_version_id:
                          type: string
                          format: uuid
                        version_no:
                          type: integer
                        planning_mode:
                          type: string
                        status:
                          type: string
                        source:
                          type: string
                        currency:
                          type: string
                        total_cost_minor:
                          type: integer
                        estimated_duration_min:
                          type: integer
                        activities_count:
                          type: integer
                        evidence:
                          type: object
                          required:
                          - frozen
                          - expired
                          - reference_consistent
                          properties:
                            frozen:
                              type: boolean
                            snapshot_id:
                              type:
                              - string
                              - 'null'
                            expires_at:
                              type:
                              - string
                              - 'null'
                            expired:
                              type:
                              - boolean
                              - 'null'
                            reference_consistent:
                              type: boolean
                            detail:
                              type:
                              - string
                              - 'null'
                        feasibility:
                          type: object
                          properties:
                            feasible:
                              type:
                              - boolean
                              - 'null'
                            failures:
                              type: array
                              items:
                                type: string
                            detail:
                              type:
                              - string
                              - 'null'
                  next_action:
                    type: object
                    required:
                    - kind
                    - door
                    properties:
                      kind:
                        type: string
                        enum:
                        - select_or_start
                        - generate_plans
                        - recompose
                        - none
                      door:
                        type:
                        - string
                        - 'null'
                  observed_at:
                    type: string
        '401':
          description: No traveller credentials presented (error.reason_code TRAVELER_CREDENTIALS_MISSING)
        '403':
          description: The caller holds no in-force seat on this journey (error.reason_code
            JOURNEY_MEMBER_REQUIRED)
        '404':
          description: Journey not found

components:
  parameters:
    DemoResetToken:
      # ORD-0389: the claim that opens the whole-library reset.  Optional in the schema because a
      # caller who omits it must still get a named answer (RESET_TOKEN_REQUIRED) rather than a
      # transport-level 422 -- the refusal is the product behaviour being pinned.
      name: X-Demo-Reset-Token
      in: header
      required: false
      schema: {type: string}
    TravelerId:
      name: traveler_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    JourneyId:
      name: journey_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ActivityId:
      name: activity_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    EventId:
      name: event_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PlanVersionId:
      name: plan_version_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    IdempotencyKeyOptional:
      # Same transport vocabulary, only `required` differs: an operation that may be called
      # without a client key references this sibling instead of restating the header.
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 8, maxLength: 128}
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Conflict:
      description: State or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationError:
      description: Input validation error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Infeasible:
      description: No feasible result under hard constraints
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    BadGateway:
      description: Upstream native runtime is unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    SlotTime:
      properties:
        day_index:
          type: integer
          minimum: 0.0
          title: Day Index
        slot_index:
          type: integer
          minimum: 0.0
          title: Slot Index
        start_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          title: Start Time
        end_time:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          title: End Time
      additionalProperties: false
      type: object
      required:
      - day_index
      - slot_index
      - start_time
      - end_time
      title: SlotTime
    PrepareDraft:
      properties:
        expected_revision:
          type: integer
          minimum: 0.0
          title: Expected Revision
        schedule:
          items:
            $ref: '#/components/schemas/SlotTime'
          type: array
          minItems: 1
          title: Schedule
      additionalProperties: false
      type: object
      required:
      - expected_revision
      - schedule
      title: PrepareDraft
    PreparationGap:
      properties:
        sequence_no:
          type: integer
          title: Sequence No
        title:
          type: string
          title: Title
        kind:
          type: string
          title: Kind
        place_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Place Id
        status:
          type: string
          const: UNKNOWN
          title: Status
        resolution:
          type: string
          title: Resolution
        detail:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Detail
      type: object
      required:
      - sequence_no
      - title
      - kind
      - place_id
      - status
      - resolution
      title: PreparationGap
    PreparationResult:
      properties:
        journey_id:
          type: string
          title: Journey Id
        task_id:
          type: string
          title: Task Id
        draft_revision:
          type: integer
          title: Draft Revision
        plan_version_id:
          type: string
          title: Plan Version Id
        status:
          type: string
          const: CANDIDATE
          title: Status
        selected:
          type: boolean
          const: false
          title: Selected
        activated:
          type: boolean
          const: false
          title: Activated
        slots_count:
          type: integer
          title: Slots Count
        gaps:
          items:
            $ref: '#/components/schemas/PreparationGap'
          type: array
          title: Gaps
        mobility_frozen:
          type: boolean
          const: false
          title: Mobility Frozen
        unrouted_count:
          type: integer
          title: Unrouted Count
          default: 0
        known_subtotal_minor:
          type: integer
          title: Known Subtotal Minor
          default: 0
        opening_checks:
          items:
            $ref: '#/components/schemas/OpeningCheck'
          type: array
          title: Opening Checks
          default: []
        idempotency_replay:
          type: boolean
          title: Idempotency Replay
          default: false
      type: object
      required:
      - journey_id
      - task_id
      - draft_revision
      - plan_version_id
      - status
      - selected
      - activated
      - slots_count
      - gaps
      - mobility_frozen
      title: PreparationResult
    PlanningMode:
      type: string
      enum: [balanced, budget, explore, strict_schedule]
    HealthResponse:
      type: object
      required: [status, database, ai]
      properties:
        status: {type: string, enum: [ok, degraded]}
        database: {type: string, enum: [ok, error]}
        ai: {type: string, enum: [available, unavailable, disabled]}
        # ORD-0359: additive. `ai` keeps its two words for existing clients; `ai_state` names the
        # reason, which `ai` cannot do because it folds three different facts into one string.
        ai_state:
          type: string
          enum: [CONFIGURED_UNVERIFIED, NOT_CONFIGURED, DISABLED_BY_OPS, PROVIDER_REFUSED]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            trace_id: {type: string}
            # Shipped by ORD-0332: `trace_id` says which envelope the server built (fresh every time),
            # while `error_receipt_id` says which *call's* rejection this is, so a retry of the same
            # failing call reproduces it and a traveller can read it aloud.  Derived, not stored: see
            # `contracts/ERROR_RECEIPT_ID_V1.md` for the recipe and the alphabet.  Absent when the
            # rejection was not built inside a request - never an empty string.
            error_receipt_id: {type: string, pattern: '^CNX-[23456789ABCDEFGHJKMNPQRSTVWXYZ]{8}$'}
            # Shipped by ORD-0101/ORD-0108: `code` is the HTTP-level class, `message_key` is what
            # a screen looks up, and `reason_code` names *which* condition refused when one code
            # covers several.  Present only where a raise site knows one, so absence is a real
            # answer and not an empty string.
            message_key: {type: string}
            reason_code: {type: string}
