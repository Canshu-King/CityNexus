  /providers/v9:
    get:
      operationId: getRealTripProviderStatus
      responses:
        '200': {description: "Region-aware provider readiness and honest absence semantics, content: {application/json: {schema: {type: object}}}"}
  /journeys/{journey_id}/edge/devices:
    post:
      operationId: registerEdgeCompanion
      responses:
        '201': {description: "Scoped Edge Companion credential returned once, content: {application/json: {schema: {type: object}}}"}
  /edge/devices/{device_id}/journey-snapshot:
    get:
      operationId: getEdgeJourneySnapshot
      responses:
        '200': {description: "Compact read-only current and next Journey state, content: {application/json: {schema: {type: object}}}"}
  /edge/devices/{device_id}/actions:
