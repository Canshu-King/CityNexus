    get:
      operationId: listJourneyRoleRules
      description: >-
        The product's own answer to what a role may do, read off the seeded table
        (`journey_role_capabilities`).  Each row carries a capability and the message key that states
        the role's scope in one sentence - the sentence itself is not here, because a server-authored
        string reaching a screen is the defect this project keeps having to fix.
      responses:
        '200':
          description: One entry per role, with its capabilities
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JourneyRoleRule'}
        '404': {$ref: '#/components/responses/NotFound'}

