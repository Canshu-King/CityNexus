openapi: 3.1.0
info:
  title: CityNexus MVP API
  version: 0.1.0
  description: >-
    Coursework MVP contract. Deterministic feasibility is authoritative; AI is optional.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /demo/scene/ensure:
    post:
      operationId: ensureDemoScene
      # ORD-0521: an empty store had exactly one way to become a demo trip -- `demo/reset`, which
      # deletes 52 tables before it seeds anything.  This door is the additive half of that story:
      # it registers the supply this server already holds offline (`data/mock/places.json`, 16 rows,
      # `provider_key=mock-city`, read from disk with no socket), installs only the fixture rows the
      # store does not already hold, and advances one journey to a SELECTED plan.  It never deletes;
      # `rows_deleted` is reported in the body so a reader can check the claim instead of trusting
      # it.  A destination the supply cannot hold is refused by name rather than answered with an
      # invented place, and the refusal rolls its own staged install back.
      parameters:
        - {$ref: '#/components/parameters/DemoSceneToken'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                city_code:
                  type: string
                  description: >-
                    A destination this server's supply can hold.  Omit it to take the city the
                    shipped scenario is set in; a city the supply does not hold is refused, not
                    invented.
      responses:
        '200':
          description: >-
            One trip the store can walk.  `state` is READY when a plan was selected, or
            SCENE_INSTALLED_BUT_PLAN_REFUSED when the supply landed and a later hop refused -- that
            hop is carried in `advance_refused_steps` rather than smoothed over.  A key replayed with
            the same body returns the first receipt with `idempotency_replay` true and writes no
            further rows.
          content:
            application/json:
              schema:
                type: object
                required: [state, journey_id, plan_version_id, supply, advance]
                properties:
                  state: {type: string, enum: [READY, SCENE_INSTALLED_BUT_PLAN_REFUSED]}
                  journey_id: {type: string}
                  city_code: {type: string}
                  journey_status: {type: string}
                  plan_version_id:
                    type: [string, "null"]
                  scene_label: {type: string}
                  supply:
                    type: object
                    properties:
                      supply_leg: {type: string}
                      destructive: {type: boolean}
                      rows_deleted: {type: integer}
                      rows_installed: {type: integer}
                      rows_already_present: {type: integer}
                      places_held: {type: object}
                      supported_city_codes: {type: array, items: {type: string}}
                  advance: {type: object}
        '403':
          description: >-
            Refused before anything was written, with `error.reason_code` naming which guard spoke:
            DEMO_MODE_REQUIRED when CITYNEXUS_DEMO_MODE is off, SCENE_TOKEN_REQUIRED when no token
            was presented, SCENE_TOKEN_INVALID when the presented token is not this deployment's.
            Neither refusal reaches the catalogue, and neither echoes the token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: >-
            DEMO_STATE_SUPPLY_UNAVAILABLE: this server holds no place row for that destination.  The
            body names the failed hop, how many places it holds there, and the cities its supply does
            cover, so the screen can say "this server cannot obtain places" instead of showing an
            unresolved count over a trip that was never supplied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: >-
            Missing `Idempotency-Key`, or the same key presented against a different body
            (`IDEMPOTENCY_KEY_REUSE_CONFLICT`) -- which is refused rather than run as a second board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /demo/reset:
    post:
      operationId: resetDemo
      # ORD-0389: deleting 52 tables is not a demo convenience, it is a data-destruction route.
      # `CITYNEXUS_DEMO_MODE=true` says the deployment may be a stage -- it does not say who may
      # empty it, and the shared preview is started with that flag on.  The reset now also needs
      # the operator's token, read from CITYNEXUS_DEMO_RESET_TOKEN at call time.  The product
      # default is unset, which makes this route refuse every caller: an out-of-the-box deployment
      # cannot be emptied through it.  No screen can satisfy this header, so none offers the action.
      parameters:
        - {$ref: '#/components/parameters/DemoResetToken'}
      responses:
        '200':
          description: Demo database reset and seeded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: reset}
        '403':
          description: >-
            Refused, and nothing was deleted: either no token was presented
            (RESET_TOKEN_REQUIRED) or the one presented does not match, including the case where
            this deployment never configured one (RESET_TOKEN_INVALID).  Both are answered before
            the guardian worker is stopped, so a refusal has no side effect at all.  The two codes
            carry identical `details`, deliberately: a difference would be a free probe for
            "is this box resettable".
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/ErrorEnvelope'}
                  - type: object
                    properties:
                      error:
                        type: object
                        properties:
                          code: {type: string, enum: [RESET_TOKEN_REQUIRED, RESET_TOKEN_INVALID, DEMO_MODE_REQUIRED]}
                          details:
                            type: object
                            required: [tables_protected]
                            properties:
                              tables_protected: {type: boolean, const: true}
                              header: {type: string, const: X-Demo-Reset-Token}
                              flag: {type: string, const: CITYNEXUS_DEMO_MODE}
  /travelers:
    post:
      operationId: createTraveler
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TravelerCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Traveler'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /travelers/{traveler_id}:
    parameters:
      - {$ref: '#/components/parameters/TravelerId'}
    get:
      operationId: getTraveler
      responses:
        '200':
          description: Traveler
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Traveler'}
        '404': {$ref: '#/components/responses/NotFound'}
  /travelers/{traveler_id}/preferences:
    parameters:
      - {$ref: '#/components/parameters/TravelerId'}
    get:
      operationId: listPreferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Preference'}
    put:
      operationId: replacePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {$ref: '#/components/schemas/PreferenceInput'}
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Preference'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /travelers/{traveler_id}/capabilities:
    parameters:
      - {$ref: '#/components/parameters/TravelerId'}
    get:
      operationId: listTravelerCapabilities
      responses:
        '200': {description: Explicit traveler capability facts}
    put:
      operationId: replaceTravelerCapabilities
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: array, items: {type: object}}
      responses:
        '200': {description: Staged capability facts}
  /travelers/{traveler_id}/capabilities/confirm:
    parameters:
      - {$ref: '#/components/parameters/TravelerId'}
    post:
      operationId: confirmTravelerCapabilities
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: array, items: {type: object}}
      responses:
        '200': {description: Confirmed durable capability facts}
  /travelers/{traveler_id}/agent-policy:
    parameters:
      - {$ref: '#/components/parameters/TravelerId'}
    get:
      operationId: getAgentPolicy
      responses:
        '200':
          description: Server-owned traveler Agent delegation policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPolicy'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: putAgentPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentPolicyPayload'}
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPolicy'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /agent/tools:
    get:
      operationId: listAgentTools
      responses:
        '200':
          description: Safe CityNexus Agent tool catalog
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentToolDescriptor'}
  /agent/tools/v2:
    get:
      operationId: listAgentToolsV2
      responses:
        '200':
          description: Expanded typed CityNexus Agent tool catalog
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AgentToolDescriptor'}
  /agent/runtime-status:
    get:
      operationId: getAgentRuntimeStatus
      responses:
        '200':
          description: Non-secret agent runtime identity and MCP proof status
          content:
            application/json:
              schema:
                type: object
                required:
                  - runtime_identity
                  - native_binary_detected
                  - native_mcp_proven
                  - mcp_server
                  - deepseek_configured
                  - hermes_compat_configured
                properties:
                  runtime_identity: {type: string}
                  native_binary_detected: {type: boolean}
                  native_mcp_proven: {type: boolean}
                  mcp_server: {type: string}
                  deepseek_configured: {type: boolean}
                  hermes_compat_configured: {type: boolean}
                  # ORD-0359: additive and deliberately NOT in `required`, so a client written
                  # against the old shape neither breaks on it nor is promised the field.
                  ai_state:
                    type: string
                    enum: [CONFIGURED_UNVERIFIED, NOT_CONFIGURED, DISABLED_BY_OPS, PROVIDER_REFUSED]
                  hermes_native_gateway: {type: object}
  /agent/hermes/capabilities:
    get:
      operationId: getNativeHermesCapabilities
      responses:
        '200':
          description: Non-secret official Hermes Runs API capability status
          content:
            application/json:
              schema: {type: object}
  /agent/hermes/runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getNativeHermesRun
      responses:
        '200':
          description: Native Hermes run status
          content:
            application/json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}
  /agent/hermes/runs/{run_id}/events:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: streamNativeHermesRunEvents
      responses:
        '200':
          description: Native Hermes run progress as server-sent events
          content:
            text/event-stream:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/agent/hermes/runs/{run_id}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: run_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getJourneyNativeHermesRun
      responses:
        '200':
          description: Journey-scoped native Hermes run status
          content:
            application/json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/agent/hermes/runs/{run_id}/timeline:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: run_id
        in: path
        required: true
        schema: {type: string}
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 250, default: 100}
    get:
      operationId: getJourneyNativeHermesTimeline
      responses:
        '200':
          description: Persisted normalized native Hermes event timeline
          content:
            application/json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/agent/hermes/runs/{run_id}/events:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: run_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: streamJourneyNativeHermesRunEvents
      responses:
        '200':
          description: Journey-scoped native Hermes events as server-sent events
          content:
            text/event-stream:
              schema: {type: string}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/agent/hermes/runs/{run_id}/stop:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - name: run_id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: stopJourneyNativeHermesRun
      responses:
        '200':
          description: Native Hermes run stop receipt
          content:
            application/json:
              schema: {type: object}
        '404': {$ref: '#/components/responses/NotFound'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /agent/tools/{tool_name}:
    parameters:
      - name: tool_name
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: callAgentTool
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentToolCall'}
      responses:
        '200':
          description: Structured server-owned Agent tool receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /agent/tools/v2/{tool_name}:
    parameters:
      - name: tool_name
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: callAgentToolV2
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentToolCall'}
      responses:
        '200':
          description: Structured typed Agent action receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentToolResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys:
    get:
      operationId: listJourneys
      description: >-
        ORD-0383 slice 1: the trips this server holds whose `journeys.deleted_at` is NULL.
        No pagination and no per-traveller scope yet; a trip moved to the recycle bin by
        `deleteJourney` is absent here and still answers `getJourney`.
        ORD-0477 adds the order a traveller reads that list in: one named tier per call, and
        no tier changes which rows appear.
      parameters:
        - name: sort
          in: query
          required: false
          # ORD-0477: three tiers, named in `backend/app/schemas.py::JOURNEY_SORT_TIERS`, and the
          # door checks the word itself rather than letting a schema answer it with an unnamed 422.
          # Omitting `sort` is not a fourth tier and is not a refusal: it keeps the order this door
          # shipped before tiers existed, `journeys.created_at` then `journeys.id`.
          # The instant tiers are read as instants, not as characters: `journeys.start_at` and
          # `journeys.updated_at` are TEXT columns this server writes in more than one legal
          # spelling (`+08:00` rows and `+00:00`/`Z` rows coexist), and a stored value carrying no
          # offset is read as UTC.  `TITLE` is case-folded Unicode code-point order -- it is
          # deliberately not pinyin and not stroke order, which a Chinese-speaking traveller has to
          # be told rather than shown.
          description: >-
            RECENT_UPDATE: `journeys.updated_at` newest first.  DEPARTURE_DATE: `journeys.start_at`
            earliest first.  TITLE: `journeys.title` case-folded, ascending.  Ties break on
            `journeys.id` ascending under every tier.  Any other word is refused by name.
          schema:
            type: string
            enum: [RECENT_UPDATE, DEPARTURE_DATE, TITLE]
      responses:
        '200':
          description: Journeys not deleted, in the order the tier names (or in `created_at, id` order when no tier was sent)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Journey'}
        '422':
          description: >-
            error.code = VALIDATION_ERROR with error.reason_code = JOURNEY_SORT_NOT_RECOGNISED, when
            `sort` was sent a word that is not one of the three tiers.  The door refuses rather than
            answering in its own default order: a list that looks sorted but was not sorted by the
            word the traveller asked for is the failure this order forbids.  `error.details` names
            the word sent and the tiers supported.  An empty `sort=` is a sent word, so it is
            refused too.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    post:
      operationId: createJourney
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getJourney
      responses:
        '200':
          description: Journey
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteJourney
      description: >-
        ORD-0383 slice 1: soft delete.  The row, its plan and its history survive; only
        `journeys.deleted_at` and `audit_log` change, and `status` is not rewritten.
      responses:
        '204': {description: Deleted - the row is in the recycle bin}
        '404':
          description: "error.code = NOT_FOUND with error.reason_code = JOURNEY_NOT_FOUND - no such row"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: "error.code = CONFLICT with error.reason_code = JOURNEY_ALREADY_DELETED - the row is already in the bin, and its original deleted_at is left unchanged"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    patch:
      operationId: updateJourney
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyPatch'}
      responses:
        '200':
          description: Updated journey
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}/calendar.ics:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: getJourneyCalendarIcs
      description: >-
        ORD-0496 slice 1: the trip's active plan as an RFC 5545 calendar, generated from the rows this
        server holds.  The source is `journeys.active_plan_version_id` and that plan version's
        `activities` rows -- the same pointer every other plan door reads, so an export cannot present
        a schedule the product does not consider active, and there is no second notion of "the plan"
        behind this door.  Nothing is scheduled by this door: it is a read.
        One clocked activity row is one VEVENT, printed in `activities.sequence_no` order.  An interval
        whose stored end falls on a later UTC day than its stored start stays the one event the row is
        and is counted in `X-CityNexus-Ics-Cross-Day`, because splitting it would need a start instant
        for the second half and an end instant for the first, and no column holds either.
        `DTSTART`/`DTEND` are the row's own instants converted to UTC (so no `VTIMEZONE` component is
        emitted, and no offset is re-labelled), and `DTSTAMP` is the row's own `updated_at` with
        `created_at` behind it -- never the moment the export was asked for, which is what makes two
        exports of an unchanged trip the same bytes.
        A row with no usable clock -- `start_at` or `end_at` empty, unparseable, or a time without its
        own UTC offset -- is skipped and counted, never guessed at and never dropped quietly.  A plan
        with no clocked activity answers 200 with a `VCALENDAR` holding no VEVENT, and the headers say
        so in numbers.
      responses:
        '200':
          description: >-
            The calendar for the trip's active plan.  CRLF-terminated lines of at most 75 octets each
            (RFC 5545 section 3.1), SUMMARY/LOCATION/DESCRIPTION escaped per section 3.3.11.
          headers:
            Cache-Control:
              schema: {type: string, const: 'no-cache'}
              description: >-
                The same value the three streaming doors already carry, so a phone that re-exports after
                editing the trip revalidates instead of reopening a stored file.
            Content-Disposition:
              schema: {type: string}
              description: >-
                `attachment; filename="calendar.ics"; filename*=UTF-8''<title>--<journey id>.ics`.  The
                ASCII half stays generic on purpose: a CJK title has no honest ASCII form and
                transliterating one would be this server naming a trip the traveller never named.  The
                `filename*` half carries the real title percent-encoded per RFC 5987, with the journey
                id appended so two trips sharing a title do not arrive as one file.
            X-CityNexus-Ics-Events:
              schema: {type: string}
              description: >-
                VEVENTs printed.  The arithmetic a screen may lean on is: activities = events +
                X-CityNexus-Ics-Skipped-No-Clock + X-CityNexus-Ics-Skipped-No-Stamps.
            X-CityNexus-Ics-Skipped-No-Clock:
              schema: {type: string}
              description: >-
                Activity rows skipped because `start_at` or `end_at` is empty, unparseable, or a clock
                with no UTC offset.  This is the named handling for "no time"; the alternative is this
                server inventing an instant.
            X-CityNexus-Ics-Skipped-No-Stamps:
              schema: {type: string}
              description: >-
                Activity rows with a usable interval but no usable `updated_at` or `created_at` of their
                own, which is the second way a row cannot be printed without fabricating a time.
            X-CityNexus-Ics-Cross-Day:
              schema: {type: string}
              description: >-
                Events among the printed ones whose `DTSTART` and `DTEND` fall on different UTC days.
            X-CityNexus-Ics-Activities:
              schema: {type: string}
              description: >-
                Activity rows the active plan version holds, i.e. the denominator for the three counts
                above.
            X-CityNexus-Ics-Whitespace-Trimmed:
              schema: {type: string}
              description: >-
                Values whose leading or trailing plain space had to be removed, because RFC 5545
                section 3.1 forbids one at either edge of a value and a fold cannot carry one either.
                Reported rather than spent quietly.
          content:
            text/calendar; charset=utf-8:
              schema: {type: string, format: binary}
        '404':
          description: >-
            error.code = NOT_FOUND with error.reason_code = JOURNEY_NOT_FOUND - no such row.  The
            status, `message_key` and sentence are the ones `getJourney` answers with; this door grows
            no second 404 shape.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: >-
            error.code = CONFLICT, with error.reason_code naming which condition refused.
            CALENDAR_JOURNEY_IN_RECYCLE_BIN: the trip is in the bin, and `listJourneys` refuses to list
            it, so its schedule is not exportable either; 找回 first.  CALENDAR_SOURCE_UNREADABLE with
            `error.details.reason` = ACTIVE_PLAN_NOT_DECLARED (the trip has no active plan),
            ACTIVE_PLAN_ROW_ABSENT (the pointer names a plan version this server no longer holds), or
            ACTIVE_PLAN_BELONGS_TO_ANOTHER_JOURNEY (the pointer names another trip's plan) -- three
            different facts, and "here is your empty calendar" would be a lie about all three.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /journeys/{journey_id}/undelete:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: undeleteJourney
      description: >-
        ORD-0399 找回 (undelete): writes NULL back to `journeys.deleted_at`, so the trip returns to
        `listJourneys`.  The row was never removed by `deleteJourney`, so its plan, activities and
        history are the same rows.  `status` and `updated_at` are not written, and no
        `Idempotency-Key` is taken: whether the write happens is decided by the durable
        `deleted_at`, and a replayed tap is refused rather than replayed as a success.
        The word pair is 找回 / undelete - 恢复 and `recover*` are autonomous recovery in this
        product, 还原 is the plan-version-history screen's word, and `restore` means a reload
        bringing back a draft.
      responses:
        '200':
          description: The trip, back in the list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '404':
          description: "error.code = NOT_FOUND with error.reason_code = JOURNEY_NOT_FOUND - no such row"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: "error.code = CONFLICT with error.reason_code = JOURNEY_NOT_DELETED - the row was never in the bin, so nothing was written"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /journeys/{journey_id}/abort:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: abortJourney
      description: >-
        ORD-0520 中止: writes `journeys.status` = CANCELLED together with the traveller's own
        reason (`abort_reason`) and the server's moment (`aborted_at`), in one conditional UPDATE
        whose predicate carries the status and the empty `aborted_at` this tap read, so the store -
        not this process - decides who wrote the row.  `CANCELLED` is a word the store's CHECK
        already held; no door on this server wrote it before this one, so nothing that today reads
        a CANCELLED trip has to be re-audited for a new meaning.

        中止 is not 丢弃.  This door does not touch `journeys.deleted_at`, so the trip stays in
        `listJourneys` and stays out of `/recycle-bin/journeys`; the bin's two doors
        (`deleteJourney`, `undeleteJourney`) keep their own verbs and their own refusals, and this
        order mints no word that they already own - 找回 and 还原 are the bin's and the plan-version
        screen's, and 恢复 stays autonomous recovery.

        What an aborted trip loses is its place on 实时行程, and that judgement is this server's, not
        the device's: every journey answered here carries `live_view` = {included, reason_code},
        computed by one function from the same durable status, and `getJourney`, `listJourneys` and
        `getJourneyExperience` answer it for the same row through that one function.

        `reason` is required and is stored as given - an empty sentence is refused (422) rather than
        written, because a trip that is over "for no reason" would leave the screen inventing one.
        `actor_traveler_id` is the traveller this request speaks for and is compared against the
        row's own `traveler_id`; it is a declared identity, the same kind the member doors take, and
        binding a caller to a name is the authentication decision this order leaves open.  There is
        no `Idempotency-Key`: the durable status decides, so a replayed tap is refused as
        `JOURNEY_ALREADY_ABORTED` and quotes the moment and reason already stored instead of
        overwriting them.  Nothing here un-aborts a trip - this server has no such door, so no
        screen may promise one, and the words for getting a trip back belong to the bin.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyAbort'}
      responses:
        '200':
          description: >-
            The trip as the store now holds it: status CANCELLED, the reason, the moment, and
            `live_view.included` = false
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Journey'}
        '403':
          description: >-
            error.reason_code = ABORT_ACTOR_NOT_OWNER - the actor named on this request is not the
            traveller the row belongs to, so it carries no authority over it.  Nothing was written,
            and the row keeps the status and the empty abort columns it had.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404':
          description: "error.code = NOT_FOUND with error.reason_code = JOURNEY_NOT_FOUND - no such row"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: >-
            error.code = CONFLICT with error.reason_code = JOURNEY_ALREADY_ABORTED (the trip is
            already off, and `details` repeats the stored `aborted_at` and `abort_reason` rather
            than replacing them) / ABORT_JOURNEY_IN_RECYCLE_BIN (the owner dropped the whole trip in
            the bin; 中止 is not 丢弃, so it is refused here and the trip aborts once 找回 puts it
            back) / ABORT_WRITE_CONTESTED (another writer held this row through all three attempts
            and did neither of those things, so nothing was written and this tap says so)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /travelers/{traveler_id}/recycle-bin/journeys:
    get:
      operationId: listTravelerRecycleBinJourneys
      description: >-
        ORD-0434 step 2: the recycle bin scoped to one owner.  A separate door rather than a query
        parameter on `/recycle-bin/journeys`, because that door's contract carries a tested promise to
        advertise no filter, no scope and no pagination, and this order does not get to bend it.  The
        rows are the same `RecycleBinJourney` shape in the same `deleted_at` newest-first order, so the
        two doors cannot disagree about a trip.  Naming an owner in a path is not proof of who is
        asking - binding a caller to a name is the daylight decision this step leaves open.
      parameters:
        - {name: traveler_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Every binned journey belonging to that traveller
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RecycleBinJourney'}
        '404': {$ref: '#/components/responses/NotFound'}

  /recycle-bin/journeys:
    get:
      operationId: listRecycleBinJourneys
      description: >-
        ORD-0402 slice 1: the trips the recycle bin holds.  This is a second door; `listJourneys`
        keeps answering with only the rows whose `journeys.deleted_at` is NULL, so nothing a
        client of that door sees changes.  Each row here carries `deleted_at` as stored plus
        `bin_state` = IN_RECYCLE_BIN, both read from the column - a screen does not have to infer
        a deletion from a trip being missing from the other list.
        This version is the whole bin: no pagination, no per-traveller scope and no filter
        parameters, ordered by `deleted_at` newest first.  Nothing here deletes permanently; this
        server has no such door, and no copy in the client may promise one.
      responses:
        '200':
          description: Trips in the recycle bin, newest deletion first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RecycleBinJourney'}
  /journeys/{journey_id}/checkins:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: listJourneyCheckins
      description: >-
        ORD-0476 slice 1: this trip's footprints, oldest stamp first, each carrying its target read
        back from the row it points at.  Nothing is copied into a stamp: `activity_title`,
        `activity_type`, `place_name` and `place_category` resolve from `activities` and `places` on
        every read (`backend/app/services.py` -- `checkin_schema`), so a stamp cannot show a name its
        target no longer holds.  Those four are nullable and the null is a fact rather than a blank:
        both target rows can be deleted underneath a live stamp (`ON DELETE SET NULL` in
        `backend/db/schema.sql`, triggered in practice by the replan path at
        `backend/app/main.py`), and the footprint is the traveller's own history, so it outlives
        them and says so instead of inventing a title.

        A trip with no stamps answers `[]` -- absence is a list, not a 404.  No pagination, no filter,
        no date window, and there is no permanent-delete door for a stamp on this server.
      responses:
        '200':
          description: This trip's stamps in the order they were taken
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JourneyCheckin'}
        '409':
          description: >-
            error.reason_code = CHECKIN_JOURNEY_IN_RECYCLE_BIN -- the trip is in the bin, and the same
            rule holds at the write door so a screen cannot read footprints of a trip
            `GET /api/v1/journeys` refuses to list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    post:
      operationId: createJourneyCheckin
      description: >-
        ORD-0476 slice 1: stamp one target of this trip.  Exactly one of `activity_id` / `place_id`
        must be named, and both ways of getting that wrong are refused by name
        (`CHECKIN_TARGET_REQUIRED`, `CHECKIN_TARGET_AMBIGUOUS`) rather than guessed, because the
        target is what the duplicate promise is keyed on.

        `stamped_at` is the server's instant and the request body has no time field at all: a device
        clock must not arrive dressed as a store fact.  An offline queue that carries its own moment is
        a named input requiring an offset, not this door widening its own.  `source` carries one value
        today (`FOREGROUND_WEB`) and the store CHECKs it, so a second channel has to arrive as a
        contract change instead of free text.

        A replayed tap is not a second success.  The door names the row that already won
        (`CHECKIN_DUPLICATE_STAMP` with `existing_checkin_id` and `existing_stamped_at`), and
        `UNIQUE (journey_id, target_key)` is the durable half of that sentence across workers -- the
        loser of the race is converted into the same named refusal, not a 500.  No idempotency key is
        taken here because the target already is one.  Nothing else is written: no activity completed,
        no plan version touched, no day moved, which is what separates this door from 完成 and
        加进计划.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyCheckinCreate'}
      responses:
        '201':
          description: The stamp as this server now holds it, with its target resolved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyCheckin'}
        '404':
          description: >-
            error.reason_code = CHECKIN_JOURNEY_UNKNOWN / CHECKIN_ACTIVITY_UNKNOWN /
            CHECKIN_PLACE_UNKNOWN -- no row of that
            kind carries the id; kept apart from "not yours" because the two facts deserve two
            sentences
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: >-
            error.reason_code = CHECKIN_JOURNEY_IN_RECYCLE_BIN / CHECKIN_ACTIVITY_NOT_IN_JOURNEY /
            CHECKIN_DUPLICATE_STAMP -- the trip is in the bin (409, not 404: the row exists and 找回
            puts it back), the activity lives under another trip's plan version, or that target is
            already stamped here
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: >-
            error.reason_code = CHECKIN_TARGET_REQUIRED / CHECKIN_TARGET_AMBIGUOUS when the body names
            neither or both; the framework's own validation shape when a named id or note is outside
            its bounds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /journeys/{journey_id}/share-grants:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: createShareGrant
      description: >-
        ORD-0434 step 1: a share grant becomes a server fact instead of a URL the client assembles.
        One journey can hold many grants; each carries a named visibility, an optional deadline, the
        moment it was withdrawn, and the creator the creating device asserted - not authenticated in
        this step, because the anonymous read is still the product's default.  An `expires_at` without
        an offset is refused: reading a bare instant against the server's own clock would be a guess
        about the traveller's.  ORD-0460: an `expires_at` the server can already read as spent is
        refused here for the same reason it would be refused on read - `expires <= now` - so no token
        is minted that would answer 409 SHARE_GRANT_EXPIRED in the caller's hands.  The boundary
        belongs to the refused side: an instant equal to "now" is already spent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShareGrantCreate'}
      responses:
        '201':
          description: The grant, with the token its holder needs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareGrant'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: "error.code = VALIDATION_ERROR with error.reason_code = SHARE_GRANT_CREATOR_EMPTY / SHARE_GRANT_EXPIRY_UNREADABLE / SHARE_GRANT_EXPIRY_NO_OFFSET / SHARE_GRANT_EXPIRY_IN_PAST"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    get:
      operationId: listShareGrants
      description: >-
        Every grant of this journey, withdrawn ones included: a row that vanished from the list would
        be indistinguishable from one that never existed.
      responses:
        '200':
          description: The grants of this journey, oldest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ShareGrant'}
        '404': {$ref: '#/components/responses/NotFound'}

  /journeys/{journey_id}/share-grants/{grant_id}/revoke:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {name: grant_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: revokeShareGrant
      description: >-
        Withdrawal takes effect on the token's next read.  A second withdrawal is a different answer,
        not a repeat of the first.
      responses:
        '200':
          description: Withdrawn now
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShareGrantRevoked'}
        '404':
          description: "error.code = NOT_FOUND with error.reason_code = SHARE_GRANT_UNKNOWN - no grant of this journey carries that id"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: "error.code = CONFLICT with error.reason_code = SHARE_GRANT_ALREADY_REVOKED - this grant was withdrawn earlier"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /shared/journeys/{token}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
      - name: member
        in: query
        required: false
        schema: {type: string, format: uuid}
        description: >-
            Who is reading, when the grant is INVITEES_ONLY.  Absent on such a grant answers 409 with
            error.reason_code = SHARE_GRANT_MEMBERSHIP_REQUIRED rather than waving the read through;
            a name that is not in force answers SHARE_GRANT_NOT_A_MEMBER.
    get:
      operationId: readSharedJourney
      description: >-
        The door a grant token is presented at, so that a deadline and a withdrawal can mean
        something.  A successful read answers `SharedJourneyRead`: the same `Journey` fields
        `/journeys/{journey_id}` answers with, plus the two things a landing screen cannot derive --
        the plan this grant lets its holder read, and a name for whether there is one.  The stops come
        out of THIS door and no other, because a screen that filled itself in from an unguarded door
        would keep working after the deadline passed and after the owner withdrew the link.  The named
        facts ride in `error.reason_code`, inside the one envelope every door already uses: never
        existed is 404 NOT_FOUND / SHARE_GRANT_UNKNOWN, while withdrawn, out of date, not-link-readable
        and binned-by-its-owner are 409 CONFLICT with their own reason_code.  PRIVATE and
        INVITEES_ONLY fail closed as SHARE_GRANT_NOT_LINK_READABLE until the member data behind them
        says otherwise.
      responses:
        '200':
          description: >-
            The journey this grant lets its holder read, plus what this grant covers.  A
            journey-level grant adds `grant_scope: JOURNEY` and no plan; a version-scoped one (ORD-0466)
            adds `grant_scope: PLAN_VERSION` and `shared_plan`, which is the same PlanVersion shape
            `/journeys/{journey_id}/plans` answers with - one shape, not a second one that can drift.
            ORD-0465 adds the guest's own view of the days alongside it (`plan_state`, `active_plan`),
            because the landing screen needs a stop's name and its position and the canonical plan
            projection resolves neither into a field a guest is shown.  Written as one `allOf` arm so
            the door keeps a single description of its body: `tests/test_qoder_ord0466_version_share.py`
            reads `grant_scope` out of this exact position, and a named component here would move it.
            The same position carries a second duty from ORD-0475: the keys named in `properties` below
            ARE the whitelist that door may answer with beyond the owner's own journey body, and the
            gate reads them from here instead of restating them, so widening this door means writing
            this contract where a reviewer can see it.  What the gate forbids is a key going missing,
            never a key being documented.  From ORD-0481 the comparison runs both ways: the `required`
            list under this arm is read the same way, and a key promised there that this door stops
            answering is a refusal, not a silent narrowing.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Journey'}
                  - type: object
                    required: [grant_scope, plan_state]
                    properties:
                      grant_scope: {type: string, enum: [JOURNEY, PLAN_VERSION]}
                      shared_plan: {$ref: '#/components/schemas/PlanVersion'}
                      plan_state:
                        type: string
                        enum: [PLAN_PRESENT, NO_PLAN, PLAN_ROW_MISSING]
                        description: >-
                          Named rather than left to be inferred from `active_plan` being null, because a
                          null is two different facts wearing one shape: this trip never had a plan, and
                          this trip points at a plan row the store does not hold.  The three values here
                          are exactly the three `_shared_plan_projection` can answer with, and the third
                          is fail-closed rather than observed:
                          `journeys.active_plan_version_id` is a foreign key, measured to answer
                          `FOREIGN KEY constraint failed` when a dangling pointer is written through the
                          same session, so no test in this tree reaches that value over HTTP.  It stays
                          in the contract because the branch stays in the server, and a client must not
                          be surprised by a word it was never told to expect.
                      active_plan:
                        oneOf:
                          - {$ref: '#/components/schemas/SharedPlan'}
                          - {'type': 'null'}
        '409':
          description: "error.code = CONFLICT with error.reason_code = SHARE_GRANT_REVOKED / SHARE_GRANT_EXPIRED / SHARE_GRANT_NOT_LINK_READABLE / SHARE_GRANT_EXPIRY_UNREADABLE / SHARE_GRANT_VERSION_GONE / SHARE_GRANT_JOURNEY_IN_RECYCLE_BIN - a grant that stopped allowing a read, a version this journey no longer holds, or a trip its owner put in the recycle bin"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404':
          description: "error.code = NOT_FOUND with error.reason_code = SHARE_GRANT_UNKNOWN (never existed) or SHARE_GRANT_JOURNEY_GONE - a different number from the one above, on purpose"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /journeys/{journey_id}/members:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: addJourneyMember
      description: >-
        ORD-0434 step 2: one member set per journey.  The store holds the single-set promise as a
        unique index on (journey_id, traveler_id), so a second invitation to the same traveller is
        refused by name instead of quietly listing them twice.  `expires_at` follows the grant rule:
        no offset means no instant stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyMemberCreate'}
      responses:
        '201':
          description: The membership row, with the state derived from its own columns
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyMember'}
        '404':
          description: "error.code = NOT_FOUND with error.reason_code = MEMBER_TRAVELER_UNKNOWN"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: "error.code = CONFLICT with error.reason_code = MEMBER_ALREADY_PRESENT"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: "error.code = VALIDATION_ERROR with error.reason_code = MEMBER_INVITER_EMPTY / MEMBER_EXPIRY_UNREADABLE / MEMBER_EXPIRY_NO_OFFSET / MEMBER_EXPIRY_IN_PAST (a deadline the server would already read as spent, the instant equal to now included, is refused before the row is written -- the same verdict the grant write door answers with, and no membership row is created)"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    get:
      operationId: listJourneyMembers
      description: >-
        The whole set, withdrawn rows included and carrying `removed_at`: a screen has to be able to
        say someone was in and is out without inferring it from an absence.
      responses:
        '200':
          description: The journey's members, oldest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JourneyMember'}
        '404': {$ref: '#/components/responses/NotFound'}

  /journeys/{journey_id}/members/{member_id}/withdraw:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {name: member_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: withdrawJourneyMember
      description: >-
        Takes effect on the next read of anything that checks membership, including an
        `INVITEES_ONLY` token read.  A second withdrawal answers differently from the first.
      responses:
        '200':
          description: The row, now carrying its withdrawal moment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyMember'}
        '404':
          description: "error.code = NOT_FOUND with error.reason_code = MEMBER_UNKNOWN"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: "error.code = CONFLICT with error.reason_code = MEMBER_ALREADY_WITHDRAWN"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}

  /journeys/{journey_id}/members/{member_id}/role:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {name: member_id, in: path, required: true, schema: {type: string}}
    x-citynexus-max-administrators-per-journey: 2
    # ORD-0503 names the cap here because this is the door that refuses on it.  The same number is
    # `MAX_ADMINISTRATORS_PER_JOURNEY` in `backend/app/main.py` and `max_administrators` in the answer
    # of `/member-role-limits`; `tests/test_qoder_ord0503_member_doors.py` reads all three and fails
    # if any two disagree, which is what keeps the roster's 上限 sentence from being the only place
    # the real limit is written down.
    post:
      operationId: changeJourneyMemberRole
      description: >-
        Move one member of one journey between the roles the server already knows.  The actor is
        named on the request, not resolved from a session this product does not have, and that name
        is checked: it must hold an in-force membership on this journey, and that membership's role
        must hold `MEMBER_MANAGE` in `journey_role_capabilities` -- the door asks the seeded table,
        so narrowing what a role may do narrows this door the same instant.  Guards run in a fixed
        order (unknown row, withdrawn row, no-op change, self-change, OWNER seat, actor authority,
        ADMIN capacity) and each has its own counterexample, because read in another order some of
        them would never be reachable and that is the same as the rule not being there.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyMemberRoleChange'}
      responses:
        '200':
          description: The row read back through the same payload the list door uses, with `updated_at` moved and `joined_at` not
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyMember'}
        '403':
          description: "error.reason_code = MEMBER_ACTOR_NOT_IN_JOURNEY / MEMBER_ACTOR_LAPSED / MEMBER_MANAGE_NOT_PERMITTED"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '404':
          description: "error.code = NOT_FOUND with error.reason_code = MEMBER_UNKNOWN"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: "error.code = CONFLICT with error.reason_code = MEMBER_ROLE_UNCHANGED / MEMBER_ALREADY_WITHDRAWN / MEMBER_ROLE_SELF_CHANGE_REFUSED / MEMBER_OWNER_ROLE_IMMUTABLE / MEMBER_ADMIN_CAP_REACHED"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: "error.code = VALIDATION_ERROR: a role outside `MemberRole`, an actor id that is not a uuid, or a field this body does not take (`additionalProperties: false`)"

  /journeys/{journey_id}/members/self-exit:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    post:
      operationId: leaveJourneyAsSelf
      description: >-
        The traveller named on the request takes themselves out.  Deliberately not
        `/members/{member_id}/withdraw`: that door answers to whoever calls it about whomever it
        names, which is right for clearing somebody else's seat and wrong for leaving.  Here there is
        no `member_id` to point at, so the only row this door can write is the caller's own.  The
        OWNER refusal is what stops a trip becoming unowned by its own owner walking out; a withdrawn
        row stays listed carrying `removed_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JourneyMemberSelfExit'}
      responses:
        '200':
          description: The caller's row, now carrying its withdrawal moment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JourneyMember'}
        '404':
          description: "error.code = NOT_FOUND with error.reason_code = MEMBER_SELF_EXIT_NOT_A_MEMBER"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: "error.code = CONFLICT with error.reason_code = MEMBER_ALREADY_WITHDRAWN / MEMBER_OWNER_CANNOT_LEAVE"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: "error.code = VALIDATION_ERROR: a traveller id that is not a uuid, or a field this body does not take (`additionalProperties: false`)"

  /journeys/{journey_id}/member-role-limits:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: readJourneyMemberRoleLimits
      description: >-
        The cap and the seats it has already been spent on, answered by the server.  A roster that
        typed its own number would hold the limit in two places with only one of them load bearing,
        which is why the screen reads this door and an arm pins its `max_administrators` to the
        `x-citynexus-max-administrators-per-journey` named above.
      responses:
        '200':
          description: The enforced cap, the in-force ADMIN count on this journey, and the role words the doors accept
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberRoleLimits'}
        '404': {$ref: '#/components/responses/NotFound'}

  /journeys/{journey_id}/acl/roles:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: listJourneyRoleRules
      description: >-
        The product's own answer to what a role may do, read off the seeded table
        (`journey_role_capabilities`).  Each row carries a capability and the message key that states
        the role's scope in one sentence - the sentence itself is not here, because a server-authored
        string reaching a screen is the defect this project keeps having to fix.
      responses:
        '200':
          description: One entry per role, with its capabilities
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JourneyRoleRule'}
        '404': {$ref: '#/components/responses/NotFound'}

  /collections:
    get:
      operationId: listCollections
      parameters:
        - name: traveler_id
          in: query
          required: true
          description: >-
            Whose shelves to answer.  Required: `collection_folders.owner_traveler_id` is NOT NULL,
            so every row carries an owner and there is no shelf this filter can silently miss.  The
            id is matched, not authenticated -- the anonymous read is still this product's default.
          schema: {type: string, minLength: 1, maxLength: 64}
      description: >-
        ORD-0444: one traveller's collection shelves, each with the rows on it.  The 收藏 exit
        of the POI capture chain needed a container to land in; before this order the product had no
        such object at all (`collection`/`favorite`/收藏 named nothing but GeoJSON FeatureCollection).
        One door answers both halves because a screen that had to ask per shelf could not tie a
        count to the rows beneath it: `item_count` here is the length of that same answer's `items`
        array (`backend/app/services.py` -- `collection_folder_schema`).
        Scoped by `traveler_id` and by nothing else: there is no pagination and no sort parameter.
        「我的收藏」 is now a claim the row carries (its owner column), not a name a screen hopes.  A
        traveller holding no shelf is answered `[]` -- absence is a list, not a 404.
      responses:
        '200':
          description: That traveller's shelves, oldest created first, each carrying its rows in add order
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CollectionFolder'}
        '422':
          description: The required `traveler_id` was omitted, by the framework's own validation shape
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    post:
      operationId: createCollection
      description: >-
        ORD-0444: name a shelf and say whose it is.  `name` is bounded exactly as
        `TravelerCreate.display_name` is (1..120 characters) and stored verbatim -- there is no
        rename door on this server yet, so what is written here is what the shelf reads for as long
        as it exists.  Two shelves may share a name; the id addresses one.
        `owner_traveler_id` is the 成员归属: it is stored on the row and validated against
        `travelers`, so an id nothing carries is refused by name (`MEMBER_TRAVELER_UNKNOWN`, the same
        words `POST /api/v1/journeys/{journey_id}/members` uses for that fact) instead of becoming an
        orphan shelf no scoped read can ever answer.  It is what the caller asserts, not what this
        server authenticates.
        The body is the shelf as `listCollections` answers it, read back through the same helper
        (`backend/app/main.py` -- `_collection_rows_by_folder`), so a new shelf reports
        `item_count` 0 because the read found no rows, not because the door typed a zero.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionFolderCreate'}
      responses:
        '201':
          description: The shelf as this server now holds it, with no rows on it yet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionFolder'}
        '404':
          description: >-
            No traveller carries `owner_traveler_id`; the refusal names it in `error.reason_code`
            (`backend/app/main.py` -- `create_collection`) rather than storing the row
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: Name or owner missing, or outside their bounds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  /collections/{folder_id}/items:
    parameters:
      - {$ref: '#/components/parameters/CollectionFolderId'}
    post:
      operationId: addCollectionItem
      description: >-
        ORD-0444: put one place on one shelf.  The row stores a *reference* to `places`, not a copy:
        the name, category, city code and coordinate in the answer are resolved from that row on
        every read, so a shelf cannot show a place the store no longer holds under it.  No plan,
        activity or day is written -- that is the 加进计划 door's job, and the reason 收藏 is a
        separate exit at all.
        `folder_id` is a plain string rather than a uuid-formatted parameter, and that is what makes
        the counter-case answerable: a shelf this server does not hold is
        `404 COLLECTION_FOLDER_NOT_FOUND`, a place it does not hold is `404 PLACE_NOT_FOUND`, and a
        place already on that shelf is `409 PLACE_ALREADY_IN_COLLECTION` naming the row that won.
        None of the three is a 500 and none is the generic `require()` not-found, because the three
        conditions need three different sentences on a screen.
        One shelf holds a place once, enforced by `UNIQUE(folder_id, place_id)`
        (`backend/db/schema.sql`) so two workers taking two taps of the same place cannot both
        write.  There is no remove-from-shelf door on this server yet; nothing here may imply one.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionItemCreate'}
      responses:
        '201':
          description: The row as this server now holds it, with the place resolved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionItem'}
        '404':
          description: COLLECTION_FOLDER_NOT_FOUND, or PLACE_NOT_FOUND -- which one is in `reason_code`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '409':
          description: PLACE_ALREADY_IN_COLLECTION; `details` names the row that is already there
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
        '422':
          description: Body outside the declared bounds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
