        expires_at: {type: [string, 'null'], format: date-time}
    ShareGrant:
      type: object
      required: [id, journey_id, visibility, created_by, expires_at, revoked_at, created_at, updated_at, token]
      properties:
        id: {type: string, format: uuid}
        journey_id: {type: string, format: uuid}
        visibility: {$ref: '#/components/schemas/ShareVisibility'}
        created_by: {type: string}
        expires_at:
          type: [string, 'null']
          format: date-time
          description: null means no deadline was ever set - not a far-future date, not the server's clock.
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: null means this grant has never been withdrawn.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        token:
          type: string
          description: >-
            The whole capability a holder needs.  It is a random value the server minted, not the
            journey id, so withdrawing a grant cannot be worked around by knowing a trip's address.
