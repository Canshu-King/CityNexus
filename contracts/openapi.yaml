          schema: {type: string, format: date-time}
        - name: end_at
          in: query
          required: true
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Normalised provider booking slots with provenance
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BookingSlot'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /journeys/{journey_id}/plans/generate:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
      - {$ref: '#/components/parameters/IdempotencyKeyOptional'}
    post:
      operationId: generatePlans
      description: >-
        Generate feasible candidates.  ORD-0272 gives a batch a server-readable owner:
        `mission_id` (body) says *whose* continuation this is and is what a second tab, a cleared
        storage or a second device replays on, while `Idempotency-Key` (header) stays the
        transport-level "is this the same send" control.  They are deliberately two keys - merged
        into one, "same mission, different request" and "same request, resent" become
        indistinguishable in storage.  Omit both and the operation keeps its pre-ORD-0272 shape.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                planning_mode: {$ref: '#/components/schemas/PlanningMode'}
                candidate_count: {type: integer, minimum: 1, maximum: 5, default: 3}
                place_ids:
                  type: array
                  minItems: 2
                  maxItems: 12
                  items: {type: string}
                  description: Explicit selected/discovered POIs for the generic Compose Engine path.
                mission_id:
                  type: string
                  format: uuid
                  description: >-
                    Continuation owner (ORD-0272).  Must be a JourneyMission of *this* journey;
                    an unknown or foreign one answers 404 and claims nothing.
      responses:
        '201':
          description: Feasible candidate plans
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanVersion'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Infeasible'}
  /journeys/{journey_id}/plans:
    parameters:
      - {$ref: '#/components/parameters/JourneyId'}
    get:
      operationId: listPlans
      responses:
        '200':
          description: 'Every plan version this journey has ever had (CANDIDATE / SELECTED / ACTIVE / SUPERSEDED / REJECTED), in version_no order. Which one the journey runs is `is_current` - the server''s projection of `journey.active_plan_version_id` - and not the array position, the newest `version_no`, or the row''s `status` (ORD-0097); a journey with no pointer reports `is_current: false` on every row.'
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PlanVersion'}
  /plans/{plan_version_id}:
    parameters:
      - {$ref: '#/components/parameters/PlanVersionId'}
    get:
      operationId: getPlan
      responses:
        '200':
          description: Plan with activities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanVersion'}
        '404': {$ref: '#/components/responses/NotFound'}
  /journeys/{journey_id}/plans/{plan_version_id}/select:
