    TravelerRecycleBinJourney:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        traveler_id:
          type: string
          format: uuid
          title: Traveler Id
        title:
          type: string
          title: Title
        city_code:
          type: string
          title: City Code
        timezone:
          type: string
          title: Timezone
        start_at:
          type: string
          format: date-time
          title: Start At
        end_at:
          type: string
          format: date-time
          title: End At
        timezone_honoured:
          type: boolean
          title: Timezone Honoured
          default: true
        budget:
          $ref: '#/components/schemas/Money'
        planning_mode:
          type: string
          enum:
          - balanced
          - budget
          - explore
          - strict_schedule
          title: Planning Mode
          default: balanced
        status:
          type: string
          enum:
          - DRAFT
          - PLANNED
          - ACTIVE
          - COMPLETED
          - CANCELLED
          title: Status
        active_plan_version_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Active Plan Version Id
        current_activity_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Current Activity Id
        aborted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Aborted At
        abort_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Abort Reason
        live_view:
          $ref: '#/components/schemas/JourneyLiveView'
        deleted_at:
          type: string
          format: date-time
          title: Deleted At
        bin_state:
          type: string
          const: IN_RECYCLE_BIN
          title: Bin State
        ownership:
          type: string
          enum:
          - OWNED_BY_THIS_TRAVELER
          - OWNED_BY_ANOTHER_TRAVELER
          - NOT_STATED
          title: Ownership
        member_role:
          anyOf:
          - type: string
            enum:
            - OWNER
            - ADMIN
            - COLLABORATOR
          - type: 'null'
          title: Member Role
        recovery:
          type: string
          enum:
          - RECOVERY_ALLOWED
          - RECOVERY_REFUSED_NOT_OWNER
          - RECOVERY_REFUSED_ROLE_CANNOT_RESTORE
          - RECOVERY_REFUSED_NO_SEAT
          title: Recovery
      type: object
      required:
      - id
      - traveler_id
      - title
      - city_code
      - timezone
      - start_at
      - end_at
      - budget
      - status
      - live_view
      - deleted_at
      - bin_state
      - ownership
      - recovery
      title: TravelerRecycleBinJourney
      description: "One binned trip, answered from one traveller's seat (ORD-0531).\n\n\
        The two extra names are the whole point of this shape.  A bin row used to say\
        \ only \"this is in\nthe bin\", which left a screen to decide whether it may offer\
        \ 找回 by comparing ids it was never\ngiven a rule about -- the same mistake ORD-0239\
        \ names for every other derived state on this\nproduct.  So the server says it:\n\
        \n* `ownership` -- whose trip this is, relative to the traveller named in the\
        \ path.  The column\n  already exists (`journeys.traveler_id`); no new column\
        \ was needed to know it, so none was\n  invented.  `NOT_STATED` is reserved for\
        \ a row the store cannot attribute, and a screen must\n  treat it as no authority\
        \ rather than as a missing value to guess at.\n* `recovery` -- whether this traveller\
        \ may take the trip back, and if not, in which of the three\n  ways not.  It is\
        \ decided from `journey_role_capabilities`, read through the same helper the\n\
        \  member doors use, so narrowing that table narrows this answer the same instant.\n\
        \nA refused row still appears: an owner who shared a trip must be able to see\
        \ that it is there and\nread why it is not theirs to restore.  What may not happen\
        \ is a row that looks restorable."
