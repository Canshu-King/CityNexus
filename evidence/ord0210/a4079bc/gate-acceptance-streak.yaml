  - ORD-0218 (g5) —— 只复用本契约的词表与读数形状（形制、逐 run node verdict、分类名），
    **不**据此结案：它现在是一条 RED/诊断，把十条当结案门槛套上去会逼出"为凑 10 连绿而重设计门"
    （仲裁 20:01 的 scope 修正）
