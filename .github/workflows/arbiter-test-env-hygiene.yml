name: arbiter-test-env-hygiene

on:
  push:
    branches:
      - arbiter/test-env-hygiene

jobs:
  backend-full-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [clean, inherited-provider-env]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync backend test dependencies
        run: uv sync --all-extras --frozen
      - name: Run full backend suite (clean terminal)
        if: matrix.mode == 'clean'
        env:
          DEEPSEEK_API_KEY: ''
          OPENAI_API_KEY: ''
          CITYNEXUS_AI_API_KEY: ''
          CITYNEXUS_AI_MODEL: ''
          CITYNEXUS_AI_VISION_MODEL: ''
          CITYNEXUS_AI_PROVIDER: ''
          CITYNEXUS_AI_ENABLED: ''
          CITYNEXUS_HERMES_API_KEY: ''
          CITYNEXUS_HERMES_API_SERVER_KEY: ''
          CITYNEXUS_HERMES_MODEL: ''
          CITYNEXUS_HERMES_NATIVE_PROVIDER: ''
          CITYNEXUS_HERMES_NATIVE_MODEL: ''
        run: uv run python -m pytest -q
      - name: Run full backend suite (credential-polluted terminal)
        if: matrix.mode == 'inherited-provider-env'
        env:
          DEEPSEEK_API_KEY: 'dummy-deepseek-key-for-env-hygiene-test'
          OPENAI_API_KEY: 'dummy-openai-key-for-env-hygiene-test'
          CITYNEXUS_AI_API_KEY: 'dummy-citynexus-ai-key-for-env-hygiene-test'
          CITYNEXUS_AI_MODEL: 'dummy-live-model'
          CITYNEXUS_AI_VISION_MODEL: 'dummy-vision-model'
          CITYNEXUS_AI_PROVIDER: 'deepseek'
          CITYNEXUS_AI_ENABLED: 'true'
          CITYNEXUS_HERMES_API_KEY: 'dummy-hermes-key-for-env-hygiene-test'
          CITYNEXUS_HERMES_API_SERVER_KEY: 'dummy-hermes-server-key-for-env-hygiene-test'
          CITYNEXUS_HERMES_MODEL: 'dummy-hermes-model'
          CITYNEXUS_HERMES_NATIVE_PROVIDER: 'dummy-provider'
          CITYNEXUS_HERMES_NATIVE_MODEL: 'dummy-native-model'
        run: uv run python -m pytest -q
