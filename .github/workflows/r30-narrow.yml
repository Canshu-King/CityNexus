name: R30 narrow validation

on:
  push:
    branches:
      - gpt/revolution-r30-consent-epoch-shock-recovery
  workflow_dispatch:

jobs:
  r30-narrow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked backend test dependencies
        working-directory: backend
        run: uv sync --extra dev --no-install-project

      - name: Compile R30 surfaces
        working-directory: backend
        run: |
          uv run python -m compileall -q app run_r30_live.py scripts/r30_machine_verdict.py scripts/r30_delivery_gate.py

      - name: Run R30 narrow regression suite
        working-directory: backend
        run: |
          uv run python -m pytest -q \
            tests/test_r29_disagreement_mediation.py \
            tests/test_r28_authenticated_member_principal.py \
            tests/test_r28_durable_approval_continuation.py \
            tests/test_agent_runtime_state_epoch.py \
            tests/test_agent_mission_runtime.py \
            tests/test_agent_runtime_gate.py \
            tests/test_agent_authority_v2_actions.py \
            tests/test_agent_principal_boundary.py \
            tests/test_r30_collective_authority_receipt.py
