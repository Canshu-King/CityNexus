name: R30 narrow validation

on:
  push:
    branches:
      - gpt/revolution-r30-consent-epoch-shock-recovery
  workflow_dispatch:

jobs:
  r30-narrow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Compile R30 surfaces
        working-directory: backend
        run: |
          python -m compileall -q app run_r30_live.py scripts/r30_machine_verdict.py

      - name: Run R30 narrow regression suite
        working-directory: backend
        run: |
          python -m pytest -q             tests/test_r29_disagreement_mediation.py             tests/test_r28_authenticated_member_principal.py             tests/test_r28_durable_approval_continuation.py
